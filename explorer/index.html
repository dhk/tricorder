<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>tricorder — PR review analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500&family=Barlow+Condensed:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f9f8f6;        --bg2: #f2f1ee;        --bg3: #eae9e5;
    --border: #dddbd6;    --text: #0a0a09;       --text-dim: #5a5850;
    --accent: #16a34a;    --accent-blue: #2970d6; --accent-purple: #7c5ce0;
    --accent-orange: #d94f2a;
    --font-sans: 'Barlow', sans-serif;
    --font-cond: 'Barlow Condensed', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --border-radius: 4px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { min-height: 100vh; }
  ::selection { background: rgba(22,163,74,0.18); }
  /* Scrollbars kept light to match the system */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #d8d6d0; }
  ::-webkit-scrollbar-track { background: transparent; }

  @keyframes drawerIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes cellPop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#f2f1ee"/>
      <rect x="20" y="20" width="14" height="14" rx="2" fill="#16a34a"/>
      <rect x="38" y="20" width="14" height="14" rx="2" fill="#9fd9b4"/>
      <rect x="56" y="20" width="14" height="14" rx="2" fill="#d7efe0"/>
      <rect x="20" y="38" width="14" height="14" rx="2" fill="#d7efe0"/>
      <rect x="38" y="38" width="14" height="14" rx="2" fill="#16a34a"/>
      <rect x="56" y="38" width="14" height="14" rx="2" fill="#9fd9b4"/>
      <rect x="20" y="56" width="14" height="14" rx="2" fill="#9fd9b4"/>
      <rect x="38" y="56" width="14" height="14" rx="2" fill="#d7efe0"/>
      <rect x="56" y="56" width="14" height="14" rx="2" fill="#16a34a"/>
    </svg>
  </template>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Recharts (for the reviewer radar charts) -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <!-- Data + components -->
  <script src="data.js"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="coverage.jsx"></script>
  <script type="text/babel" src="pipeline.jsx"></script>
  <script type="text/babel" src="profiles.jsx"></script>
  <script type="text/babel" src="gaps.jsx"></script>
  <script type="text/babel" src="fingerprints.jsx"></script>
  <script type="text/babel" src="tour.jsx"></script>
  <script type="text/babel" src="intro.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
