<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>tricorder — PR review analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* DHK Design System v2 — Electric Cobalt, light theme only.
     Source of truth: https://www.dhk.io/design-system.md
     Tokens below mirror global.css there; do not invent new ones. */
  :root {
    --bg: #f5f6fa;          --bg2: #eceef5;          --bg3: #e0e3f0;
    --border: #c8cde0;      --border-light: #d8dbeb;
    --text: #0d0f1a;        --text-muted: #2a2d42;   --text-dim: #5a5d78;
    --accent: #2b50e8;      --accent-hover: #1a3bd4;
    --accent-purple: #8b2adc; --accent-orange: #e05c2a; --accent-teal: #0ea5b0;
    --font-sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --radius: 4px;
    --sp1: 4px; --sp2: 8px; --sp3: 12px; --sp4: 16px; --sp5: 24px; --sp6: 32px; --sp7: 48px;
    --motion-fast: 0.15s;
    --motion-reveal: 1s cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { min-height: 100vh; }
  ::selection { background: rgba(43,80,232,0.18); }
  a { color: var(--accent); }
  a:hover { color: var(--accent-hover); }

  /* focus baseline: mandatory, never removed */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  :focus:not(:focus-visible) { outline: none; }

  /* skip link: visually hidden until focused */
  .skip-link {
    position: absolute; left: var(--sp4); top: -100px; z-index: 300;
    font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
    background: var(--accent); color: #fff; padding: var(--sp3) var(--sp5); border-radius: var(--radius);
  }
  .skip-link:focus { top: var(--sp4); }

  /* scrollbars follow the grey ladder */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--border); }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
  @media print {
    :root { --bg: #fff; --bg2: #fff; --bg3: #fff; }
    body { color: #000; }
    a { color: #000; text-decoration: underline; }
  }
</style>
</head>
<body>
  <a class="skip-link" href="#root">Skip to content</a>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

      <rect x="56" y="20" width="14" height="14" rx="2" fill="#d5dcfa"/>
      <rect x="20" y="38" width="14" height="14" rx="2" fill="#d5dcfa"/>
      <rect x="38" y="38" width="14" height="14" rx="2" fill="#2b50e8"/>
      <rect x="56" y="38" width="14" height="14" rx="2" fill="#95a7f3"/>
      <rect x="20" y="56" width="14" height="14" rx="2" fill="#95a7f3"/>
      <rect x="38" y="56" width="14" height="14" rx="2" fill="#d5dcfa"/>
      <rect x="56" y="56" width="14" height="14" rx="2" fill="#2b50e8"/>
    </svg>
  </template>

  <!-- React + Babel (pinned) -->

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Data + components -->
  <script src="data.js"></script>

</body>
</html>
