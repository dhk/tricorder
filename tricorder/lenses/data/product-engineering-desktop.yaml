  axes:
    - id: ipc-boundary
      question: "Are Tauri commands validated at the Rust/webview boundary — inputs checked, payloads typed, errors mapped — rather than trusting frontend-supplied values?"
      categories: [ipc-boundary, security]
      authorities: [tauri-security-model, tauri-capabilities]
      enforceable_by:
        - tool: "tauri capabilities manifest"
          config: "src-tauri/capabilities/*.json"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: capability-minimality
      question: "Are capabilities and permissions scoped minimally per window/webview, with denies and scopes used instead of broad allows?"
      categories: [capability-scoping]
      authorities: [tauri-capabilities, tauri-permissions]
      enforceable_by:
        - tool: "tauri capabilities manifest"
          config: "src-tauri/capabilities/*.json"
          coverage: partial
        - tool: "tauri build removeUnusedCommands"
          config: "src-tauri/tauri.conf.json"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: webview-csp
      question: "Is a CSP configured in tauri.conf.json (app.security.csp), free of unsafe-inline/remote sources, and are remote URLs explicitly scoped?"
      categories: [webview-security]
      authorities: [tauri-csp, tauri-config]
      enforceable_by:
        - tool: "tauri configuration"
          config: "src-tauri/tauri.conf.json"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: unsafe-discipline
      question: "Is every unsafe block justified, minimal, and soundness-reasoned (SAFETY comments), and is unsafe growth in the dependency tree watched?"
      categories: [unsafe-rust]
      authorities: [rustonomicon, rust-api-guidelines]
      enforceable_by:
        - tool: "cargo-geiger"
          config: "Cargo.lock"
          coverage: partial
        - tool: "rustc unsafe_code lint"
          config: "Cargo.toml [lints]"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: rust-idiom
      question: "Does the Rust core follow Clippy lints and API-guideline conventions, with lint regressions denied in CI?"
      categories: [rust-idiom, style, correctness]
      authorities: [clippy-lints, rust-api-guidelines, rustc-lint-levels]
      enforceable_by:
        - tool: "clippy"
          config: "Cargo.toml"
          coverage: full
        - tool: "rustfmt"
          config: "rustfmt.toml"
          coverage: full
      max_maturity: deterministic
      phase4_absence_is_finding: false
    - id: dependency-supply-chain
      question: "Are new dependencies (crates and npm) justified, and are advisories, licenses, and update cadence enforced by cargo-deny/cargo-audit and the update bot rather than by memory?"
      categories: [dependencies, security]
      authorities: [cargo-deny, cargo-geiger]
      enforceable_by:
        - tool: "cargo-deny"
          config: "deny.toml"
          coverage: partial
        - tool: "renovate"
          config: "renovate.json"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: true
    - id: react-hygiene
      question: "Do components follow the Rules of React — hooks at top level, effects with correct dependencies and cleanup, no mutation of props/state, purity during render?"
      categories: [react-hygiene]
      authorities: [react-rules, react-hooks-rules, biome-rules]
      enforceable_by:
        - tool: "biome"
          config: "biome.json"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: typescript-strictness
      question: "Is type safety preserved — no any-casts hiding real unions, no floating promises, strict narrowing at IPC and storage boundaries?"
      categories: [typescript-strictness]
      authorities: [typescript-eslint-rules]
      enforceable_by:
        - tool: "tsc --noEmit"
          config: "tsconfig.json"
          coverage: full
        - tool: "biome"
          config: "biome.json"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: false
    - id: e2e-practice
      question: "Do UI changes ship with Playwright coverage that follows best practice — role-based locators, web-first assertions, isolated tests, run in CI — and does the PR template's Testing evidence get provided?"
      categories: [e2e-coverage, testing]
      authorities: [playwright-best-practices]
      enforceable_by:
        - tool: "playwright"
          config: "playwright.config.ts"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: packaging-sidecars
      question: "Are sidecars staged per target triple (externalBin), per-platform config merges deliberate, and bundle resources explicit — does every platform ship the right binary?"
      categories: [desktop-packaging]
      authorities: [tauri-config]
      enforceable_by:
        - tool: "tauri build (bundler)"
          config: "src-tauri/tauri.conf.json"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: updater-signing
      question: "Are updater artifacts signed (Tauri mandates signatures), macOS builds signed and notarized, Windows builds signed, and release-channel changes reviewed?"
      categories: [release-updater, security]
      authorities: [tauri-updater, tauri-macos-signing, tauri-windows-signing]
      enforceable_by:
        - tool: "tauri updater signature requirement"
          config: "src-tauri/tauri.conf.json"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: telemetry-privacy
      question: "Do new telemetry events match the published telemetry policy — no raw paths, identifiers hashed, opt-out honored?"
      categories: [telemetry-privacy]
      authorities: [berd-telemetry]
      enforceable_by: []
      max_maturity: convention
      phase4_absence_is_finding: true
    - id: accessibility
      question: "Is the webview UI keyboard operable and semantically marked up, consistent with WCAG 2.2, beyond what Biome's a11y rules catch?"
      categories: [accessibility]
      authorities: [wcag-2-2, biome-rules]
      enforceable_by:
        - tool: "biome a11y rules"
          config: "biome.json"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: style-lint
      question: "Is formatting/import/lint hygiene fully delegated to Biome and rustfmt rather than litigated in review comments?"
      categories: [style]
      authorities: [biome-rules, rustc-lint-levels]
      enforceable_by:
        - tool: "biome"
          config: "biome.json"
          coverage: full
        - tool: "lefthook"
          config: "lefthook.yml"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: false

  tooling_gates:
    - tool: biome
      config_file: "biome.json"
      enforces: [style, react-hygiene, accessibility, typescript-strictness]
      source: "https://biomejs.dev/linter/"
    - tool: clippy
      config_file: "Cargo.toml"
      enforces: [rust-idiom, correctness]
      source: "https://doc.rust-lang.org/clippy/lints.html"
    - tool: rustfmt
      config_file: "rustfmt.toml"
      enforces: [style]
      source: "https://doc.rust-lang.org/rustc/lints/levels.html"
    - tool: tsc
      config_file: "tsconfig.json"
      enforces: [typescript-strictness, correctness]
      source: "https://typescript-eslint.io/rules/"
    - tool: playwright
      config_file: "playwright.config.ts"
      enforces: [e2e-coverage]
      source: "https://playwright.dev/docs/best-practices"
    - tool: vitest
      config_file: "vitest.config.ts"
      enforces: [testing]
      source: "https://github.com/block/berd"
    - tool: lefthook
      config_file: "lefthook.yml"
      enforces: [style]
      source: "https://github.com/block/berd"
    - tool: tauri-capabilities
      config_file: "src-tauri/capabilities/*.json"
      enforces: [capability-scoping, ipc-boundary]
      source: "https://v2.tauri.app/security/capabilities/"
    - tool: cargo-deny
      config_file: "deny.toml"
      enforces: [dependencies, security]
      source: "https://github.com/EmbarkStudios/cargo-deny"

  prompt_context:
    phase1_pr_extraction: |
      This is a cross-platform desktop application: a TypeScript/React frontend
      in a system webview (src/, .tsx/.ts) and a Rust core (src-tauri/, crates/,
      .rs) talking over an IPC boundary, packaged and signed per OS with an
      auto-updater. Classify each review comment into the lens categories.
      Comments on .rs files usually concern the IPC boundary, unsafe blocks,
      error handling, or Rust idiom; comments on .tsx usually concern React
      hook/effect discipline, state, or accessibility; comments on config
      (tauri.conf.json, capabilities, biome.json, workflows) concern security
      posture, packaging, or tooling gates. Use the file tag shown with each
      comment. Cite a standard only when the comment clearly invokes it.
    phase2_reviewer_fingerprint: |
      Meaningful focus areas for this domain: IPC-boundary validation,
      capability/permission scoping, webview security (CSP), unsafe-Rust
      discipline, dependency and license hygiene across cargo and npm,
      React/TypeScript correctness, E2E coverage of UI changes, desktop
      packaging and release safety, telemetry privacy, accessibility. A
      reviewer who only ever comments on style in a repo with Biome enforced
      in CI is adding little signal. Note blind spots as domain areas the
      reviewer touches code in but never reviews (e.g., edits src-tauri but
      never discusses command validation).
    phase3_author_growth: |
      Judge author growth against this domain's expectations: correct Tauri
      command design (validated inputs, typed payloads), minimal capability
      requests, justified unsafe, clean Clippy/tsc gates, hook-correct React,
      Playwright specs accompanying UI changes, sidecar/packaging awareness,
      and telemetry that matches the published policy. Support
      recommendations should point at the lens authorities (Tauri security
      docs, Rust API Guidelines, Rustonomicon, Rules of React, Playwright
      best practices), not generic advice.
    phase4_team_gaps: |
      Report gaps only against this lens's axes. A named practice whose
      absence from the review record is itself a finding: command validation
      at the IPC boundary, capability minimality, CSP configuration, unsafe
      justification, dependency advisory/license auditing, React effect
      hygiene, E2E coverage of UI changes, per-platform sidecar packaging,
      updater signing, telemetry-policy conformance, accessibility. Before
      reporting a gap, check tooling gates: if Biome/Clippy/tsc/Playwright
      already enforce a dimension deterministically, do not report it as a
      review gap — report it as institutionalized. Never import concerns
      from other kinds of software.
    interpret: |
      Summarize for a desktop-application team: which review habits are
      enforced by the repo's own tooling (Biome, Clippy -D warnings, tsc,
      lefthook, Playwright, CI) and which still depend on human attention —
      the IPC trust boundary, capability scoping, unsafe soundness, release
      signing, telemetry policy, and WCAG-level accessibility are the
      judgment-heavy areas where coverage gaps cost the most. Map quick wins
      to concrete promotions on the maturity ladder (e.g., a repeated
      review comment about command validation becoming a documented rule,
      then a capabilities-manifest check in CI).

  must_not:
    - "Cite dbt, SQLFluff, Kimball, or dbt-project-evaluator."
    - "Report gaps about grain, fact models, staging models, source freshness, or exposure contracts."
    - "Describe this repository as an analytics, data, or SQL project."
    - "Treat CLAUDE.md, AGENTS.md, or .agents/ content as evidence about the code archetype."
    - "Recommend server-side concerns (HTTP middleware, database migrations, container orchestration) as findings."

  validation:
    test_repo: "block/berd"
    expected_selection: true
    expected_score_min: 25
    expected_runner_up: "platform-engineering"
    evidence:
      - axis: ipc-boundary
        evidence: "168 of 471 inline comments are under src-tauri/; 170 are on .rs files; README confirms a Tauri 2 shell with a bundled Goose sidecar over ACP."
      - axis: capability-minimality
        evidence: "Tauri 2 per README; src-tauri/tauri.conf.json confirmed via the README's externalBin quote; capabilities are the v2 ACL mechanism."
      - axis: webview-csp
        evidence: "index.html + vite.config.ts + 267 comments under src/ confirm a webview UI; CSP is configured in tauri.conf.json per Tauri docs."
      - axis: unsafe-discipline
        evidence: "170 comments on .rs; 7 on .swift and 4 on .m (native bridges); just clippy runs with warnings denied."
      - axis: rust-idiom
        evidence: "170 .rs comments; crates/ workspace in tree; rust-toolchain.toml and just clippy in README."
      - axis: dependency-supply-chain
        evidence: "renovate.json with a seven-day crate cooldown and a pnpm override patching GHSA-5p4m-2wfm-xmqj appear in the commit log; pnpm-lock.yaml and goose-backend.lock.json in tree."
      - axis: react-hygiene
        evidence: "131 comments on .tsx files; React 19 per README."
      - axis: typescript-strictness
        evidence: "131 comments on .ts files; tsconfig.json/tsconfig.node.json in tree; type checks run in just check."
      - axis: e2e-practice
        evidence: "playwright.config.ts and playwright.table-overflow.config.ts in tree; PR template Testing section requires before/after screenshots or a recording for UI changes."
      - axis: packaging-sidecars
        evidence: "README documents externalBin sidecar staging with the target-triple naming pattern; distro/, docker/linux/, bin/ in tree."
      - axis: updater-signing
        evidence: "7 releases and a guarded release workflow in the commit log; CHANGELOG.md maintained."
      - axis: telemetry-privacy
        evidence: "TELEMETRY.md in tree; OpenTelemetry pipeline commit on 2026-08-18."
      - axis: accessibility
        evidence: "267 comments under src/ on a consumer-facing webview UI; WCAG 2.2 applies to the rendered UI."
      - axis: style-lint
        evidence: "biome.json and lefthook.yml in tree; just check runs Biome per README."
    smoke_checks:
      - "grain"
      - "fact model"
      - "dbt"
      - "SQLFluff"
      - "Kimball"
      - "source freshness"
