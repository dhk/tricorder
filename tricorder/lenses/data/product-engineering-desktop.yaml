# Tricorder lens: desktop applications (Tauri-class: webview frontend + Rust core)
# Validated against block/berd per tricorder-lens-research.md (Q7).
lens:
  name: product-engineering-desktop
  version: 1
  status: validated
  extends: product-engineering
  domain: >-
    Cross-platform desktop applications with a web UI shell and a native core —
    the Tauri/Electron class: a TypeScript/React (or similar framework) frontend
    running in a system webview, a Rust (or native) backend process, an IPC
    boundary between them, OS-specific packaging and signing, an auto-updater,
    and end-to-end tests that drive the real UI. Reviewers in this domain care
    about the trust boundary between webview and core, capability scoping,
    unsafe native code, dependency and license hygiene across two package
    ecosystems, React/TypeScript discipline, desktop packaging and release
    safety, telemetry disclosure, and accessibility.

  detection:
    signals:
      - pattern: "src-tauri/tauri.conf.json"
        weight: 10
        rationale: "Tauri application manifest; generated by `tauri init` and required by the framework."
        source: "https://v2.tauri.app/reference/config/"
      - pattern: "src-tauri/Cargo.toml"
        weight: 6
        rationale: "Rust core crate of a Tauri shell; src-tauri is the Tauri application source directory."
        source: "https://v2.tauri.app/reference/config/"
      - pattern: "src-tauri/capabilities/*.json"
        weight: 4
        rationale: "Tauri v2 capability files; strong evidence of an ACL-managed IPC surface."
        source: "https://v2.tauri.app/security/capabilities/"
      - pattern: "src-tauri/capabilities/*.toml"
        weight: 4
        rationale: "Tauri v2 capability files (TOML variant)."
        source: "https://v2.tauri.app/security/capabilities/"
      - pattern: "package.json"
        weight: 3
        rationale: "Node/npm ecosystem manifest; the webview frontend's package root."
        source: "https://docs.npmjs.com/cli/v11/configuring-npm/package-json/"
      - pattern: "src/**/*.tsx"
        weight: 2
        rationale: "React component tree of the webview frontend."
        source: "https://react.dev/reference/rules"
      - pattern: "vite.config.ts"
        weight: 2
        rationale: "Vite frontend build, the common Tauri frontend toolchain."
        source: "https://v2.tauri.app/reference/config/"
      - pattern: "index.html"
        weight: 2
        rationale: "Webview entry point at repo root (Tauri convention)."
        source: "https://v2.tauri.app/reference/config/"
      - pattern: "playwright.config.ts"
        weight: 2
        rationale: "Playwright E2E harness for the UI."
        source: "https://playwright.dev/docs/best-practices"
      - pattern: "biome.json"
        weight: 1
        rationale: "Biome toolchain config; supporting evidence of a TS/JS codebase with lint gates."
        source: "https://biomejs.dev/linter/"
    counter_signals:
      - pattern: "dbt_project.yml"
        weight: -10
        rationale: "dbt project; belongs to the analytics-engineering lens."
      - pattern: "models/**/*.sql"
        weight: -6
        rationale: "SQL model tree; analytics-engineering evidence."
      - pattern: "go.mod"
        weight: -4
        rationale: "Go module root; not a Tauri desktop signal."
      - pattern: "manage.py"
        weight: -6
        rationale: "Django project; backend-service evidence."
      - pattern: "pubspec.yaml"
        weight: -8
        rationale: "Flutter/Dart app; a different desktop/mobile archetype."
    ignore_for_detection:
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".agents/**"
      - ".claude/**"
      - ".cursor/**"
      - ".windsurf/**"
      - ".github/copilot-instructions.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "CODEOWNERS"
      - "LICENSE"
    min_score: 10
    min_margin: 5
    composition_check:
      languages_expected: [TypeScript, Rust]
      languages_unexpected: [SQL]
    review_path_check:
      min_share_of_comments_on_tagged_paths: 0.7

  file_tags:
    - glob: "src-tauri/capabilities/*.json"
      tag: "desktop-capabilities"
    - glob: "src-tauri/capabilities/*.toml"
      tag: "desktop-capabilities"
    - glob: "src-tauri/tauri.conf.json"
      tag: "desktop-config"
    - glob: "src-tauri/**/*.rs"
      tag: "desktop-core-rust"
    - glob: "crates/**/*.rs"
      tag: "rust-workspace-crate"
    - glob: "src/**/*.tsx"
      tag: "ui-react"
    - glob: "src/**/*.ts"
      tag: "ui-logic-ts"
    - glob: "src/**/*.css"
      tag: "ui-style"
    - glob: "tests/**/*.ts"
      tag: "test-e2e"
    - glob: "**/*.spec.ts"
      tag: "test-e2e"
    - glob: "**/*.test.ts"
      tag: "test-unit"
    - glob: "**/*.test.tsx"
      tag: "test-unit"
    - glob: "bb-cli/**"
      tag: "companion-cli"
    - glob: "scripts/**"
      tag: "build-release-scripts"
    - glob: "bin/**"
      tag: "build-release-scripts"
    - glob: "distro/**"
      tag: "distribution"
    - glob: "docker/**"
      tag: "build-infra"
    - glob: ".github/workflows/*.yml"
      tag: "ci"
    - glob: "justfile"
      tag: "task-runner"
    - glob: "**/*.toml"
      tag: "tool-config"
    - glob: "**/*.md"
      tag: "docs"

  categories:
    - id: correctness
      core: true
      description: "Functional or logic defects: wrong behavior, broken state transitions, off-by-one, race conditions."
      example_comment: "This resets the scroll position whenever the parent re-renders — the guard needs to compare message ids, not list identity."
      axes: []
    - id: security
      core: true
      description: "Vulnerabilities and trust-boundary violations not better captured by a domain category."
      example_comment: "This logs the full provider auth header at info level; redact it before merge."
      axes: []
    - id: testing
      core: true
      description: "Presence and quality of unit/component tests (not E2E, which is its own category here)."
      example_comment: "Can we get a vitest case for the retry path? Right now only the happy path is covered."
      axes: []
    - id: documentation
      core: true
      description: "Docs, comments, rustdoc/JSDoc, changelog and README accuracy."
      example_comment: "This changes the lockfile contract — please update the 'Useful commands' section of the README."
      axes: []
    - id: style
      core: true
      description: "Formatting, naming, idiomatic usage, and lint hygiene."
      example_comment: "Nit: biome will reorder these imports; run just check before pushing."
      axes: [style-lint]
    - id: performance
      core: true
      description: "Rendering cost, allocations, async scheduling, startup time, bundle size."
      example_comment: "This re-parses the whole transcript on every keystroke; memoize on the message list version."
      axes: []
    - id: error-handling
      core: true
      description: "Error propagation, user-facing failure behavior, panics, unwraps, swallowed rejections."
      example_comment: "If the sidecar fails to spawn this surfaces as a blank window; map the error to a recoverable screen."
      axes: []
    - id: maintainability
      core: true
      description: "Readability, structure, duplication, dead code, module boundaries."
      example_comment: "This is the third copy of the connection-state enum; hoist it into the shared types package."
      axes: []
    - id: dependencies
      core: true
      description: "Dependency additions, upgrades, pins, overrides, and their justification (policy enforcement is dependency-supply-chain)."
      example_comment: "What's pulling in this new transitive crate? The lockfile diff adds 40 packages for one utility."
      axes: [dependency-supply-chain]
    - id: other
      core: true
      description: "Anything that does not fit another category."
      example_comment: "Flagging for awareness: this interacts with the experiment registry, details in thread."
      axes: []
    - id: ipc-boundary
      description: "Data crossing the Rust/webview boundary: command signatures, serialization, input validation, error shapes, event payloads."
      example_comment: "This command takes an arbitrary path from the frontend; validate it against the workspace root before touching the fs."
      axes: [ipc-boundary]
    - id: capability-scoping
      description: "Capabilities, permissions, and scopes: which windows/webviews may invoke which commands, and how tightly."
      example_comment: "Adding fs:allow-read-text-file to the default capability exposes it to every window; scope it to the chat window only."
      axes: [capability-minimality]
    - id: webview-security
      description: "CSP, remote URL loading, XSS exposure, protocol handlers, webview configuration."
      example_comment: "This directive adds 'unsafe-inline' to style-src globally; can we scope it or use the nonce path instead?"
      axes: [webview-csp]
    - id: unsafe-rust
      description: "unsafe blocks and their justification, soundness reasoning, FFI boundaries (Swift/Objective-C bridges included)."
      example_comment: "This unsafe block needs a SAFETY comment explaining why the pointer outlives the callback."
      axes: [unsafe-discipline]
    - id: rust-idiom
      description: "Clippy-covered idioms, error types, ownership and lifetime choices, API shape of the core."
      example_comment: "clippy::large_enum_variant fires here; box the sidecar variant."
      axes: [rust-idiom]
    - id: react-hygiene
      description: "Rules of React: hook ordering, effect dependencies and cleanup, render purity, state immutability, key usage."
      example_comment: "This effect subscribes on every render because the dep is a new object each time; memoize the config or move the subscription into a store."
      axes: [react-hygiene]
    - id: typescript-strictness
      description: "Type safety: any casts, non-null assertions, floating promises, unsafe narrowing."
      example_comment: "The `as any` here hides that the ACP payload can be null; type the union and handle the null case."
      axes: [typescript-strictness]
    - id: e2e-coverage
      description: "Playwright practice: locator quality, web-first assertions, test isolation, and whether UI changes ship with coverage."
      example_comment: "This selectors-on-class test will break on the next design-system pass; use getByRole. And the new dialog needs a spec."
      axes: [e2e-practice]
    - id: desktop-packaging
      description: "Bundling, sidecars (externalBin target-triple staging), per-platform config merges, resources, installer behavior."
      example_comment: "The sidecar rename needs the target-triple suffix or the Linux bundle will ship the macOS binary."
      axes: [packaging-sidecars]
    - id: release-updater
      description: "Release channels, updater configuration and signature handling, code signing, notarization, release workflow safety."
      example_comment: "This bumps the version without regenerating the updater manifest; the release workflow must sign the new artifacts."
      axes: [updater-signing]
    - id: telemetry-privacy
      description: "Telemetry events, their payloads, opt-in/out behavior, and consistency with the published telemetry policy."
      example_comment: "This new event includes the raw workspace path; TELEMETRY.md limits us to hashed identifiers."
      axes: [telemetry-privacy]
    - id: accessibility
      description: "Keyboard access, focus management, ARIA semantics, contrast, and other WCAG-relevant concerns in the webview UI."
      example_comment: "This div with onClick isn't keyboard reachable; make it a button so focus and Enter handling come free."
      axes: [accessibility]

