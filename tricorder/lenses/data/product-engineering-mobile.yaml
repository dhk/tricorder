  axes:
    - id: state-discipline
      tags: [state-management, ui-dart]
      question: "Is state placed deliberately — ephemeral state in the widget, app state in providers/notifiers with minimal scope — and do widgets watch only what they need (select/derived providers) rather than whole objects?"
      categories: [state-management, correctness]
      authorities: [flutter-ephemeral-vs-app, flutter-state-mgmt-options, riverpod-docs, riverpod-lint]
      enforceable_by:
        - tool: "riverpod_lint via custom_lint"
          config: "pubspec.yaml dev_dependencies (riverpod_lint, custom_lint) + analysis_options.yaml plugins"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: rebuild-performance
      tags: [ui-dart, state-management]
      question: "Are rebuilds scoped (const constructors, localized setState, builder lists, RepaintBoundary where justified) and are saveLayer/Opacity/clip and intrinsic-layout costs avoided, with jank measured in profile mode rather than guessed?"
      categories: [widget-performance, performance]
      authorities: [flutter-perf-best-practices, flutter-ui-performance, flutter-architectural-overview]
      enforceable_by:
        - tool: "flutter_lints (prefer_const_constructors and related lints)"
          config: "analysis_options.yaml"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: lifecycle-hygiene
      tags: [ui-dart, state-management]
      question: "Are controllers, listeners, and stream subscriptions released in dispose(), is setState never called after disposal, and does the app survive backgrounding, process death, and permission revocation?"
      categories: [lifecycle-disposal, correctness]
      authorities: [flutter-state-dispose, android-core-app-quality]
      enforceable_by: []
      max_maturity: convention
      phase4_absence_is_finding: true
    - id: platform-boundary
      tags: [platform-boundary-dart, native-android-kotlin, native-ios-swift, native-ios-objc, native-android-java]
      question: "Are platform channels and FFI calls typed (codec-compatible or Pigeon), invoked on the platform main thread, with native errors mapped to PlatformException/Dart errors and native memory owned explicitly (finalizers, detach on close)?"
      categories: [platform-boundary, error-handling]
      authorities: [flutter-platform-channels, dart-c-interop, dart-native-finalizer, flutter-android-c-interop, flutter-ios-c-interop]
      enforceable_by: []
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: permission-minimality
      tags: [android-manifest, ios-info-plist, privacy-manifest, ios-entitlements]
      question: "Is every declared permission tied to a shipped feature, requested in context with a purpose string/rationale, degraded gracefully on denial, and are privacy-manifest and store data-safety declarations kept in step with new SDKs?"
      categories: [permissions-privacy]
      authorities: [android-permissions-requesting, play-permissions-policy, app-store-review-guidelines, apple-privacy-manifest, android-core-app-quality]
      enforceable_by:
        - tool: "Apple privacy manifest"
          config: "**/PrivacyInfo.xcprivacy"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: data-at-rest
      tags: [ui-dart, native-android-kotlin, native-ios-swift]
      question: "Are tokens, keys, and personal data kept in Keychain/Keystore-backed storage rather than SharedPreferences/plain files, out of logs and backups, per MASVS-STORAGE?"
      categories: [secure-storage, security]
      authorities: [owasp-masvs, owasp-mastg, apple-keychain, android-security-tips]
      enforceable_by: []
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: network-security
      tags: [ios-info-plist, android-network-security, android-manifest, ui-dart]
      question: "Is all traffic TLS with platform defaults intact — no NSAllowsArbitraryLoads or usesCleartextTraffic beyond scoped, justified exceptions — and is certificate validation never disabled in Dart or native HTTP clients?"
      categories: [network-security, security]
      authorities: [owasp-masvs, apple-ats, android-network-security-config, android-security-tips]
      enforceable_by:
        - tool: "Android network security config"
          config: "**/res/xml/network_security_config.xml"
          coverage: partial
        - tool: "App Transport Security (Info.plist)"
          config: "**/ios/Runner/Info.plist"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: accessibility
      tags: [ui-dart, native-ios-swift, native-android-kotlin]
      question: "Do interactive widgets carry Semantics labels/roles, meet 48dp/44pt tap targets and contrast, and do layouts survive large text scale — checked with meetsGuideline in widget tests and with TalkBack/VoiceOver?"
      categories: [accessibility]
      authorities: [flutter-accessibility, flutter-accessibility-testing, flutter-semantics, apple-hig-accessibility, android-accessibility, wcag-2-2]
      enforceable_by:
        - tool: "flutter_test meetsGuideline"
          config: "**/test/**/*_test.dart"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: test-pyramid
      tags: [test-dart, test-integration, test-golden]
      question: "Do UI changes ship with widget tests (keys, pumpAndSettle, fake_async), are cross-cutting flows covered by integration tests on real devices, and are golden files stable across platforms and Flutter versions?"
      categories: [widget-testing, testing]
      authorities: [flutter-testing-overview, flutter-widget-testing, flutter-integration-tests, flutter-golden]
      enforceable_by:
        - tool: "flutter test in CI"
          config: ".github/workflows/*.yml"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: release-signing
      tags: [android-build, ios-build, release-config, ci, android-signing-secret]
      question: "Are keystores and key.properties out of the repo, release builds signed through Play App Signing and an Apple distribution profile, versions bumped from pubspec, App Bundles built, target SDK current, and obfuscation symbol files retained?"
      categories: [release-signing, security]
      authorities: [android-app-signing, flutter-deploy-android, flutter-deploy-ios, apple-distribution, android-app-bundle, play-target-sdk, flutter-obfuscate]
      enforceable_by:
        - tool: "fastlane / codemagic release lane"
          config: "**/fastlane/Fastfile"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: dependency-hygiene
      tags: [dependency-manifest]
      question: "Are new pub packages justified, constrained with caret ranges, kept out of dependency_overrides, is pubspec.lock committed, and are upgrades driven by pub outdated/renovate rather than memory — with third-party SDKs vetted for store privacy rules?"
      categories: [dependencies, security]
      authorities: [pub-dependencies, pub-outdated, pub-private-files, app-store-review-guidelines]
      enforceable_by:
        - tool: "renovate"
          config: "renovate.json"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: true
    - id: native-shell-hygiene
      tags: [native-android-kotlin, native-ios-swift, native-ios-objc, android-manifest, ios-entitlements, android-build, ios-build]
      question: "Does host-shell code follow the Kotlin and Swift style guides, keep components explicitly exported/unexported with validated intents and deep links, and keep entitlements, Gradle and CocoaPods changes minimal and explained?"
      categories: [native-shell, style, security]
      authorities: [kotlin-coding-conventions, android-kotlin-style, swift-api-design, android-manifest, android-security-tips, owasp-masvs]
      enforceable_by: []
      max_maturity: convention
      phase4_absence_is_finding: true
    - id: analyzer-gate
      tags: [lint-config]
      question: "Is formatting and lint hygiene fully delegated to dart format and the analyzer (flutter_lints or stricter, strict-casts/inference, custom_lint) run in CI, rather than litigated in review comments?"
      categories: [style]
      authorities: [dart-analysis-options, flutter-lints, dart-format, effective-dart-style]
      enforceable_by:
        - tool: "dart analyze / flutter analyze"
          config: "analysis_options.yaml"
          coverage: full
        - tool: "dart format --set-exit-if-changed"
          config: "analysis_options.yaml"
          coverage: full
      max_maturity: deterministic
      phase4_absence_is_finding: false

  tooling_gates:
    - tool: dart-analyzer
      config_file: "**/analysis_options.yaml"
      enforces: [style, correctness]
      source: "https://dart.dev/tools/analysis"
    - tool: android-network-security-config
      config_file: "**/res/xml/network_security_config.xml"
      enforces: [network-security]
      source: "https://developer.android.com/privacy-and-security/security-config"
    - tool: apple-privacy-manifest
      config_file: "**/PrivacyInfo.xcprivacy"
      enforces: [permissions-privacy]
      source: "https://developer.apple.com/documentation/bundleresources/privacy_manifest_files"
    - tool: integration_test
      config_file: "**/integration_test/*.dart"
      enforces: [widget-testing]
      source: "https://docs.flutter.dev/testing/integration-tests"
    - tool: fastlane
      config_file: "**/fastlane/Fastfile"
      enforces: [release-signing]
      source: "https://docs.flutter.dev/deployment/android"
    - tool: codemagic
      config_file: "**/codemagic.yaml"
      enforces: [release-signing]
      source: "https://docs.flutter.dev/deployment/ios"
    - tool: renovate
      config_file: "renovate.json"
      enforces: [dependencies]
      source: "https://dart.dev/tools/pub/cmd/pub-outdated"
    - tool: lefthook
      config_file: "lefthook.yml"
      enforces: [style]
      source: "https://dart.dev/tools/dart-format"

  prompt_context:
    phase1_pr_extraction: |
      This is a mobile application: a Flutter/Dart widget tree (lib/, .dart)
      with an explicit state-management layer, native Swift (ios/) and
      Kotlin (android/) host shells, platform channels or FFI between them,
      OS permission and privacy declarations (AndroidManifest.xml,
      Info.plist), and a store release pipeline. Classify each review
      comment into the lens categories. Comments on lib/ .dart files usually
      concern state placement, rebuild scope, disposal, error handling, or
      accessibility semantics; comments on test/ concern widget-test
      practice; comments on .kt/.swift concern the channel boundary,
      exported components, or native idiom; comments on manifests, plists,
      Gradle, Podfile, and workflows concern permissions, TLS posture, or
      signing and release. Use the file tag shown with each comment. Cite a
      standard only when the comment clearly invokes it.
    phase2_reviewer_fingerprint: |
      Meaningful focus areas for this domain: state-management discipline,
      widget rebuild performance, dispose/lifecycle hygiene, the platform
      channel and FFI boundary, permission minimality and purpose strings,
      secrets on device and TLS posture (MASVS), accessibility semantics and
      text scaling, widget/integration/golden coverage of UI changes,
      release signing and store policy, pub dependency hygiene, native-shell
      idiom. A reviewer who only comments on formatting in a repo with
      flutter_lints and dart format in CI is adding little signal. Note
      blind spots as domain areas the reviewer touches code in but never
      reviews (e.g., edits android/ but never discusses exported components
      or permissions).
    phase3_author_growth: |
      Judge author growth against this domain's expectations: state placed
      at the right scope with narrow watches, const and builder-based
      widgets, controllers disposed, typed and main-thread-safe channel
      calls, permissions requested in context and declared minimally,
      secrets in Keychain/Keystore, TLS exceptions scoped, Semantics on
      interactive widgets, widget tests accompanying UI changes, and clean
      analyzer output. Support recommendations should point at the lens
      authorities (Effective Dart, Flutter performance and testing docs,
      platform-channel docs, OWASP MASVS, Android core app quality, App
      Store Review Guidelines, Play App Signing), not generic advice.
    phase4_team_gaps: |
      Report gaps only against this lens's axes. A named practice whose
      absence from the review record is itself a finding: state scope and
      selective watching, rebuild cost, dispose hygiene, channel/FFI error
      and thread discipline, permission minimality with purpose strings,
      secure storage of secrets, TLS/ATS/network-security-config posture,
      accessibility semantics and tap targets, widget-test coverage of UI
      changes, keystore and signing safety, pub dependency justification,
      native-shell export and deep-link validation. Before reporting a gap,
      check tooling gates: if the analyzer, custom_lint, a network security
      config, a privacy manifest, or a release lane already enforce a
      dimension deterministically, report it as institutionalized, not as a
      gap. Never import concerns from other kinds of software.
    interpret: |
      Summarize for a mobile-application team: which review habits are
      enforced by the repo's own tooling (analysis_options with
      flutter_lints or stricter, custom_lint/riverpod_lint, dart format,
      CI test runs, privacy manifest, network security config, release
      lanes) and which still depend on human attention — state scope,
      rebuild cost, disposal, the channel boundary, permission minimality,
      secrets at rest, TLS exceptions, accessibility, and signing are the
      judgment-heavy areas where coverage gaps cost the most. Map quick wins
      to concrete promotions on the maturity ladder (e.g., a repeated review
      comment about missing Semantics labels becoming a documented rule,
      then a meetsGuideline check in the widget-test template).

  must_not:
    - "Cite dbt, SQLFluff, Kimball, or dbt-project-evaluator."
    - "Report gaps about grain, fact models, staging models, source freshness, or exposure contracts."
    - "Describe this repository as an analytics, data, or SQL project."
    - "Treat CLAUDE.md, AGENTS.md, or .agents/ content as evidence about the code archetype."
    - "Recommend web-only concerns (CSP, ARIA attributes, Playwright, bundle splitting) or server-side concerns (HTTP middleware, database migrations, container orchestration) as findings against the mobile client."
    - "Claim a permission or SDK is unnecessary without naming the feature that would need it; abstain rather than guess."
    - "Cite a store policy without naming the guideline section or policy page it comes from."

  validation:
    test_repo: "block/buzz"
    expected_selection: false
    expected_state: selected
    expected_winner: "product-engineering"
    expected_runner_up: "platform-engineering"
    expected_score_min: 0
    expected_score_max: 9
    evidence:
      - axis: detection
        evidence: >-
          block/buzz is a multi-archetype monorepo: desktop/ (3,221 files, Tauri shell at
          desktop/src-tauri/tauri.conf.json), crates/ (493 files, Rust workspace rooted at
          Cargo.toml), web/ and admin-web/ (React/TS), deploy/charts/*/Chart.yaml (Helm),
          and mobile/ (697 files: 376 lib/*.dart, 161 test/*.dart, 90 ios/, 49 android/).
          Language bytes 2026-09-02: Rust 21.7M, TypeScript 14.6M, Dart 5.5M, JavaScript
          4.4M, Swift 0.57M, Kotlin 0.09M — Dart is 12% of code. Every Flutter signal here is
          nested (mobile/pubspec.yaml, mobile/lib/main.dart, mobile/android/app/build.gradle.kts,
          mobile/ios/Runner/Info.plist, mobile/analysis_options.yaml, mobile/ios/Podfile) so the
          mobile lens scores 11 before counter-signals; **/src-tauri/tauri.conf.json (-4),
          root Cargo.toml (-3) and **/Chart.yaml (-2) push it to 2, below min_score 10. (A repo
          that is only a nested Flutter app — apps/mobile/ plus a README — scores 10 with no
          counter-signals and is selected with margin 6 over product-engineering.)
          Expected outcome: the parent product-engineering lens is selected (11 vs
          platform-engineering 7, margin 4 ≥ its min_margin 3), exactly as today — the mobile
          lens does not win and must not, because a lens that claims buzz is a mobile app would
          apply mobile axes to the 115 .rs and the desktop/web comments. Selecting mobile here
          would also fail review_path_check: only .dart/.kt/.swift/plist/manifest paths are
          tagged, so roughly 279 of 535 inline comments (52%, all on .dart) plus a few native
          and config paths would be tagged, under the 0.7 threshold. The right long-term answer
          for buzz is a per-path lens on mobile/ (mobile) and crates/ (backend), which detection
          does not yet support; until then the parent lens with --lens product-engineering-mobile
          scoped to mobile/ comments is the honest override. composition_check alone cannot
          catch this case (Dart is present, SQL is absent), which is why the counter-signals carry
          the weight.
      - axis: state-discipline
        evidence: "mobile/pubspec.yaml depends on hooks_riverpod ^3.0.3 and flutter_hooks, with riverpod_lint ^3.1.0 and custom_lint in dev_dependencies; 40+ *_provider.dart / *_manager.dart files under mobile/lib/features/ (channel_messages_provider.dart, channel_sort_provider.dart, working_bots_provider.dart)."
      - axis: rebuild-performance
        evidence: "279 of 535 inline comments land on .dart files; mobile/lib/features/channels/channel_detail_page/message_list.dart and message_bubble.dart are long-list chat surfaces where builder lists and rebuild scope decide jank; scrollable_positioned_list is a dependency."
      - axis: lifecycle-hygiene
        evidence: "camera_capture_cleanup.dart and camera_capture_cleanup_test.dart exist under mobile/; camera, video_player, mobile_scanner and web_socket_channel dependencies all hold controllers/subscriptions that must be disposed."
      - axis: platform-boundary
        evidence: "Paired native plugins HuddleMediaPlugin.kt / HuddleMediaPlugin.swift and HuddleAudioEngine.kt / HuddleAudioEngine.swift under mobile/android and mobile/ios are hand-written platform-channel hosts; Swift 567,064 bytes and Kotlin 93,803 bytes in the language mix."
      - axis: permission-minimality
