# Tricorder lens: mobile applications (Flutter/Dart first, with native Swift/Kotlin shells)
# Experimental. Designed against block/buzz (mobile/ subtree of a multi-archetype monorepo);
# see validation: for why buzz is expected to fall back to the parent lens rather than select this one.
lens:
  name: product-engineering-mobile
  version: 1
  status: experimental
  extends: product-engineering
  domain: >-
    Mobile applications shipped through the Apple App Store and Google Play,
    written primarily in Flutter/Dart with native Swift (ios/) and Kotlin
    (android/) shells: a widget tree whose rebuild cost is the performance
    budget, an explicit state-management layer (Riverpod, Bloc, Provider,
    ValueNotifier), platform channels and dart:ffi crossing into native code,
    OS permission and privacy declarations (AndroidManifest.xml, Info.plist
    purpose strings, privacy manifests), secure storage and TLS posture per
    OWASP MASVS, accessibility through the semantics tree and dynamic text
    scaling, a widget/integration/golden test pyramid, a lint gate in
    analysis_options.yaml, pub dependency hygiene, and a signed release
    pipeline (Play App Signing, App Store distribution). Reviewers in this
    domain care about rebuild scope, disposal of controllers and streams,
    the channel/FFI boundary, permission minimality, secrets on device,
    store-policy compliance, and whether UI changes ship with widget tests.

  detection:
    signals:
      - pattern: "pubspec.yaml"
        weight: 8
        rationale: "Dart package manifest at repo root; required by pub for every Dart/Flutter package."
        source: "https://docs.flutter.dev/tools/pubspec"
      - pattern: "**/pubspec.yaml"
        weight: 4
        rationale: "Dart package nested in a monorepo (e.g. apps/mobile/); weaker than the root form because the repo's primary artifact may be something else. Nested weights are tuned so a repo that is only a nested Flutter app still clears min_score (10) while a Flutter client beside a Rust/Tauri/Helm estate does not."
        source: "https://docs.flutter.dev/tools/pubspec"
      - pattern: "lib/main.dart"
        weight: 4
        rationale: "Flutter application entry point generated by `flutter create`."
        source: "https://docs.flutter.dev/testing/integration-tests"
      - pattern: "**/lib/main.dart"
        weight: 2
        rationale: "Flutter entry point nested in a monorepo."
        source: "https://docs.flutter.dev/testing/integration-tests"
      - pattern: "android/app/build.gradle*"
        weight: 3
        rationale: "Android host-app Gradle module (build.gradle or build.gradle.kts) of a Flutter project; carries the release signing config."
        source: "https://docs.flutter.dev/deployment/android"
      - pattern: "**/android/app/build.gradle*"
        weight: 1
        rationale: "Android host module nested in a monorepo."
        source: "https://docs.flutter.dev/deployment/android"
      - pattern: "ios/Runner/Info.plist"
        weight: 3
        rationale: "The Flutter iOS Runner target; carries bundle id, usage-description strings, and ATS settings."
        source: "https://docs.flutter.dev/deployment/ios"
      - pattern: "**/ios/Runner/Info.plist"
        weight: 1
        rationale: "iOS Runner nested in a monorepo."
        source: "https://docs.flutter.dev/deployment/ios"
      - pattern: "analysis_options.yaml"
        weight: 2
        rationale: "Dart analyzer/linter configuration at the package root; the lint gate."
        source: "https://dart.dev/tools/analysis"
      - pattern: "**/analysis_options.yaml"
        weight: 1
        rationale: "Analyzer configuration nested in a monorepo."
        source: "https://dart.dev/tools/analysis"
      - pattern: "android/app/src/main/AndroidManifest.xml"
        weight: 1
        rationale: "Android manifest of the host app: permissions, exported components."
        source: "https://developer.android.com/guide/topics/manifest/manifest-intro"
      - pattern: "integration_test/**/*.dart"
        weight: 2
        rationale: "Flutter integration_test directory convention."
        source: "https://docs.flutter.dev/testing/integration-tests"
      - pattern: "**/ios/Podfile"
        weight: 1
        rationale: "CocoaPods manifest of the iOS Runner; Flutter plugins are linked through it."
        source: "https://docs.flutter.dev/platform-integration/ios/c-interop"
      - pattern: "**/PrivacyInfo.xcprivacy"
        weight: 1
        rationale: "Apple privacy manifest; App Store submissions declare required-reason APIs and data collection here."
        source: "https://developer.apple.com/documentation/bundleresources/privacy_manifest_files"
      - pattern: "*.dart"
        weight: 1
        rationale: "Dart source anywhere in the tree; supporting evidence only."
        source: "https://dart.dev/effective-dart/style"
    counter_signals:
      - pattern: "dbt_project.yml"
        weight: -10
        rationale: "dbt project; belongs to the analytics-engineering lens."
      - pattern: "models/**/*.sql"
        weight: -6
        rationale: "SQL model tree; analytics-engineering evidence."
      - pattern: "src-tauri/tauri.conf.json"
        weight: -8
        rationale: "Tauri desktop shell at repo root; the product-engineering-desktop lens owns this archetype."
      - pattern: "**/src-tauri/tauri.conf.json"
        weight: -4
        rationale: "A Tauri desktop app elsewhere in the tree: the repository ships more than a mobile client, so the mobile lens must not claim the whole repo."
      - pattern: "Cargo.toml"
        weight: -3
        rationale: "Rust workspace at repo root: the primary artifact is likely a Rust program with a mobile client alongside (Flutter apps with a Rust core keep the crate under rust/ or native/)."
      - pattern: "**/Chart.yaml"
        weight: -2
        rationale: "Helm chart in the tree: a deployable backend lives here too; mild evidence the repo is multi-archetype."
      - pattern: "manage.py"
        weight: -6
        rationale: "Django project; backend-service evidence."
      - pattern: "go.mod"
        weight: -4
        rationale: "Go module root; not a Flutter signal."
    ignore_for_detection:
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".agents/**"
      - ".claude/**"
      - ".cursor/**"
      - ".windsurf/**"
      - ".github/copilot-instructions.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "CODEOWNERS"
      - "LICENSE"
    min_score: 10
    min_margin: 5
    composition_check:
      languages_expected: [Dart, Swift, Kotlin]
      languages_unexpected: [SQL]
    review_path_check:
      min_share_of_comments_on_tagged_paths: 0.7

