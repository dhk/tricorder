  categories:
    - id: correctness
      core: true
      description: "Functional or logic defects: wrong behavior, broken state transitions, off-by-one, race conditions."
      example_comment: "This marks the message read before the server acks; if the request fails the unread badge is wrong until restart."
      axes: []
    - id: security
      core: true
      description: "Vulnerabilities and trust-boundary violations not better captured by a domain category."
      example_comment: "This logs the relay auth token at debug level; on-device logs are readable via adb logcat on debuggable builds."
      axes: []
    - id: testing
      core: true
      description: "Presence and quality of unit tests for plain Dart logic (widget/integration/golden coverage is widget-testing)."
      example_comment: "Can we get a unit test for the event-ordering comparator? The tie-break on equal timestamps is exactly the case that bit us last time."
      axes: []
    - id: documentation
      core: true
      description: "Docs, dartdoc comments, README accuracy, changelog."
      example_comment: "This provider's contract (emits null while the keychain is locked) needs a doc comment; callers keep treating null as logged-out."
      axes: []
    - id: style
      core: true
      description: "Formatting, naming, idiomatic usage, and lint hygiene."
      example_comment: "Nit: dart format will reflow this; and prefer_single_quotes is enabled in analysis_options."
      axes: [analyzer-gate]
    - id: performance
      core: true
      description: "CPU, memory, startup time, network chattiness, and battery cost not specific to widget rebuilds."
      example_comment: "This decodes the full-resolution image on the UI isolate; use compute() or the image package's resize before display."
      axes: []
    - id: error-handling
      core: true
      description: "Error propagation, user-facing failure behavior, swallowed exceptions, PlatformException mapping."
      example_comment: "This catch has no on clause and discards the error; Effective Dart says at least rethrow or log it."
      axes: []
    - id: maintainability
      core: true
      description: "Readability, structure, duplication, dead code, module boundaries."
      example_comment: "This is the third copy of the channel-sort comparator; hoist it into channel_sort_manager.dart."
      axes: []
    - id: dependencies
      core: true
      description: "Dependency additions, upgrades, pins, overrides, and their justification (policy enforcement is dependency-hygiene)."
      example_comment: "What does this new pub package pull in transitively? The pubspec.lock diff adds 14 packages for one date formatter."
      axes: [dependency-hygiene]
    - id: other
      core: true
      description: "Anything that does not fit another category."
      example_comment: "Flagging for awareness: this changes the huddle feature flag default; details in thread."
      axes: []
    - id: state-management
      description: "Where state lives and how it flows: ephemeral vs app state, provider/notifier scope, ref lifecycle, derived state, rebuild triggers."
      example_comment: "This reads the whole channel list provider inside the message bubble; watch a select() of just the mute flag so every bubble doesn't rebuild on any channel change."
      axes: [state-discipline]
    - id: widget-performance
      description: "Rebuild scope, const constructors, builder lists, saveLayer/Opacity/clip cost, intrinsic layout passes, jank."
      example_comment: "ListView with children: builds all 2,000 rows on open; switch to ListView.builder and give the rows const constructors."
      axes: [rebuild-performance]
    - id: lifecycle-disposal
      description: "State.dispose hygiene, controllers/streams/listeners released, setState after dispose, background/foreground and process-death behavior."
      example_comment: "The AnimationController and the stream subscription are never disposed; each time the sheet opens we leak both."
      axes: [lifecycle-hygiene]
    - id: platform-boundary
      description: "Platform channels and dart:ffi: channel naming, codec types, main-thread requirement, error mapping, native memory ownership, finalizers."
      example_comment: "The Kotlin handler calls result.success from the audio thread; hop to the main looper first or Flutter will throw."
      axes: [platform-boundary]
    - id: permissions-privacy
      description: "Manifest permissions, Info.plist usage strings, runtime request timing, graceful denial, privacy manifest and store data-safety disclosures."
      example_comment: "WRITE_EXTERNAL_STORAGE isn't needed on API 29+; drop it or bound it with maxSdkVersion, and request the camera in the capture flow, not at launch."
      axes: [permission-minimality]
    - id: secure-storage
      description: "Secrets and sensitive data at rest: Keychain/Keystore vs SharedPreferences, logs, backups, cache, clipboard."
      example_comment: "The session key is written to shared_preferences; that's plaintext XML on Android. Use flutter_secure_storage (Keystore/Keychain)."
      axes: [data-at-rest]
    - id: network-security
      description: "TLS posture: cleartext exceptions, ATS/network-security-config, certificate validation and pinning, WebSocket auth."
      example_comment: "This adds NSAllowsArbitraryLoads to unblock the dev relay; scope it to the dev domain under NSExceptionDomains instead."
      axes: [network-security]
    - id: accessibility
      description: "Semantics labels and roles, screen-reader order, tap-target size, contrast, text scaling and layout at large fonts."
      example_comment: "The reaction icon button has no Semantics label; VoiceOver reads it as 'button'. Also 32dp is below the 48dp target minimum."
      axes: [accessibility]
    - id: widget-testing
      description: "Widget, integration and golden test practice: pumpWidget/pumpAndSettle use, finders by key, fake_async, whether UI changes ship with a widget test."
      example_comment: "The new compose sheet has no widget test; a testWidgets that taps send and expects the draft cleared would cover the regression."
      axes: [test-pyramid]
    - id: release-signing
      description: "Build and release: versionCode/build numbers, signing config, key.properties/keystore handling, App Bundle, target SDK, obfuscation symbols, store metadata."
      example_comment: "This commits android/key.properties with the store password; revert, rotate the upload key, and load it from CI secrets."
      axes: [release-signing]
    - id: native-shell
      description: "Swift/Kotlin host code: idiomatic style, exported components, entitlements, notification extensions, Gradle/Podfile hygiene."
      example_comment: "MainActivity is android:exported=true with a VIEW intent filter; validate the incoming URI before routing it into the channel page."
      axes: [native-shell-hygiene]

