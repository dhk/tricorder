[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "tricorder"
description = "PR review analysis for dbt/SQL analytics teams"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = [
    "anthropic",
    "requests",
]

[project.scripts]
tricorder = "tricorder.cli:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["."]
include = ["tricorder*"]
