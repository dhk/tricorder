name: Bump build number

# Runs on every push to main EXCEPT version-bump commits (which contain [skip ci]).
# Reads VERSION, increments the 4th component (build), and opens a pull request
# with the change — main requires PRs, so this cannot commit directly.
#
# Version format: MAJOR.MINOR.PATCH.BUILD
#   BUILD — auto-incremented here on every merge
#   PATCH  — bump manually when a collection of fixes warrants a patch release (1.0.1.0)
#   MINOR  — bump manually for meaningful new features (1.1.0.0)
#   MAJOR  — bump manually for large structural changes (2.0.0.0)
#
# To bump MAJOR/MINOR/PATCH: edit VERSION manually, reset BUILD to 0, commit.
# Example: echo "1.1.0.0" > VERSION && git commit VERSION -m "chore: bump to 1.1.0.0"

on:
  push:
    branches: [main]
    # A merge that only bumps VERSION must not trigger another bump. The
    # [skip ci] guard below cannot catch this on its own: a squash merge takes
    # its commit message from the PR *title*, so the marker never reaches the
    # message this workflow inspects, and each merged bump would open the next
    # one indefinitely. paths-ignore keys on what changed instead of on how the
    # commit happens to be worded.
    #
    # It skips only when VERSION is the *sole* change — a merge carrying real
    # work alongside a bump still runs, which is what we want.
    paths-ignore: [VERSION]

jobs:
  bump:
    runs-on: ubuntu-latest
    # Skip if this is already a version-bump commit
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    permissions:
      # contents: write to push the bump branch; pull-requests: write
      # because the job now opens a PR rather than pushing to main.
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN is sufficient: this job pushes a branch and opens a
          # PR, neither of which needs bypass rights. Pages deploys from main
          # when that PR is merged, by the human doing the merging.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Read and increment build number
        id: version
        run: |
          VERSION=$(cat VERSION)
          IFS='.' read -r major minor patch build <<< "$VERSION"
          NEW_BUILD=$((build + 1))
          NEW_VERSION="${major}.${minor}.${patch}.${NEW_BUILD}"
          echo "$NEW_VERSION" > VERSION
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped: $VERSION → $NEW_VERSION"

      # main is a protected branch — "Changes must be made through a pull
      # request." This job used to `git push` straight to main and was rejected
      # on every run since protection was enabled (GH006), which is why VERSION
      # sat at 1.0.1.17 while the workflow burned a runner failing identically
      # each time. `permissions: contents: write` grants repository write; it
      # does not exempt a push from a branch rule.
      #
      # So it opens a pull request instead — the same route a human takes.
      - name: Open a pull request for the bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="chore/build-${NEW_VERSION}"

          # Reruns and repeated pushes must not stack duplicate PRs.
          OPEN=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$OPEN" != "0" ]; then
            echo "PR for $BRANCH is already open; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add VERSION
          git commit -m "chore: build ${NEW_VERSION} [skip ci]"
          git push -u origin "$BRANCH"

          cat > /tmp/pr-body.md <<'BODY'
          Automated build-number bump to \`${NEW_VERSION}\`.

          VERSION is the source of truth for the package version: pyproject.toml
          reads it via \`version = {file = "VERSION"}\`, and cli.py,
          commands/build.py and tricorder-render-explorer.py read it at runtime.

          Opened by the "Bump build number" workflow, which cannot push to main
          directly because the branch requires pull requests.
          BODY

          gh pr create --title "chore: build ${NEW_VERSION}" --body-file /tmp/pr-body.md
