<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synthetic Tricorder review audit</title>
<style>
  /* DHK Design System v2.0 (Electric Cobalt, light only): https://dhk.io/design-system.md */
  :root { --bg:#f5f6fa; --bg2:#eceef5; --bg3:#e0e3f0; --border:#c8cde0; --text:#0d0f1a; --text-muted:#2a2d42; --text-dim:#5a5d78; --accent:#2b50e8; --accent-hover:#1a3bd4;
          --font-sans:system-ui,-apple-system,'Segoe UI',sans-serif; --font-mono:'DM Mono',monospace;
          --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp7:48px; --radius:4px; color-scheme:light }
  body { margin:0 auto; max-width:1200px; padding:var(--sp7) var(--sp5); display:flex; flex-direction:column; gap:var(--sp5); background:var(--bg); color:var(--text-muted); font:400 16px/1.75 var(--font-sans) }
  h1, h2, p { margin:0 }
  h1 { color:var(--text); font-size:clamp(42px,5vw,64px); font-weight:700; line-height:1.1; letter-spacing:-.02em }
  h2 { color:var(--text); font-size:28px; font-weight:600; letter-spacing:-.01em }
  header, section { display:flex; flex-direction:column; gap:var(--sp3) }
  .banner { border-left:3px solid var(--accent); padding-left:var(--sp5) }
  nav { display:flex; flex-wrap:wrap; gap:var(--sp3) }
  nav button { min-height:44px; font:400 11px var(--font-mono); text-transform:uppercase; letter-spacing:.1em; padding:var(--sp3) var(--sp5); background:transparent; color:var(--text); border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; transition:color .15s, border-color .15s }
  nav button:hover { color:var(--accent); border-color:var(--accent) }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px }
  pre { margin:0; overflow:auto; background:var(--bg2); color:var(--text); border:1px solid var(--border); border-radius:var(--radius); padding:var(--sp4); font:400 13px/1.6 var(--font-mono) }
  @media (max-width:640px) { body { padding-inline:var(--sp4) } }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { transition-duration:0.01ms !important } }
</style>
<header class="banner">
  <h1>Synthetic review audit</h1>
  <p>Entirely invented teaching data—not anonymized people or evidence, and not a personnel assessment.</p>
</header>
<nav aria-label="Audit stages">
  <button data-file="before.json">Before: evidence</button>
  <button data-file="audit.json">Audit: inference + recommendation</button>
  <button data-file="after.json">After: human decision</button>
</nav>
<section>
  <h2 id="stage">Choose a stage</h2>
  <p>Each stage is checked in and requires no API key or live service.</p>
  <pre id="data" aria-live="polite">Select a button above.</pre>
</section>
<script>
  const output = document.querySelector('#data');
  const heading = document.querySelector('#stage');
  document.querySelectorAll('button').forEach(button => button.addEventListener('click', async () => {
    const file = button.dataset.file;
    heading.textContent = button.textContent;
    output.textContent = 'Loading local fixture…';
    const response = await fetch(file);
    output.textContent = JSON.stringify(await response.json(), null, 2);
  }));
</script>
</html>
