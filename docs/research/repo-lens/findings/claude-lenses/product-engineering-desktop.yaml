  axes:
    - id: ipc-boundary
      question: "Are Tauri commands validated at the boundary (argument types, path and URL scoping, serializable return types) and are event payloads treated as untrusted?"
      categories: [ipc-boundary]
      authorities: [tauri-ipc, tauri-scope, tauri-security, tauri-isolation]
      enforceable_by:
        - tool: "tauri capabilities manifest"
          config: "src-tauri/capabilities/*.json"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: capability-scope
      question: "Is every command exposed to the webview covered by an explicit permission in a capability file, with allow/deny scopes that are as narrow as the feature needs?"
      categories: [capability-scope]
      authorities: [tauri-capabilities, tauri-permissions, tauri-scope, tauri-config]
      enforceable_by:
        - tool: "tauri capabilities manifest"
          config: "src-tauri/capabilities/*.json"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: csp-webview
      question: "Is app.security.csp set and restrictive, is remote content avoided, and is the isolation pattern considered for untrusted frontend dependencies?"
      categories: [csp-webview]
      authorities: [tauri-csp, tauri-config, tauri-isolation]
      enforceable_by:
        - tool: "tauri config"
          config: "src-tauri/tauri.conf.json"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: react-state-effects
      question: "Do components and hooks follow the Rules of React: pure render, correct effect dependencies, hooks at top level, stable keys, no state derived during render?"
      categories: [react-state-effects, performance]
      authorities: [react-rules, biome-domains, biome-exhaustive-deps]
      enforceable_by:
        - tool: "biome"
          config: "biome.json"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: true
    - id: rust-unsafe
      question: "Does every unsafe block and FFI call carry a SAFETY comment stating the invariant, and is the invariant actually upheld?"
      categories: [rust-unsafe]
      authorities: [rust-reference-unsafety, rustonomicon, rust-std-safety-comments, clippy-undocumented-unsafe]
      enforceable_by:
        - tool: "clippy"
          config: "src-tauri/Cargo.toml [lints] or clippy.toml"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: true
    - id: rust-api-idiom
      question: "Does the Rust follow the API Guidelines (naming, conversions, common traits, error types) and pass Clippy at the team's configured level?"
      categories: [rust-api-idiom, naming, error-handling]
      authorities: [rust-api-guidelines, clippy, rustfmt]
      enforceable_by:
        - tool: "clippy"
          config: "src-tauri/Cargo.toml [lints] or clippy.toml"
          coverage: partial
        - tool: "rustfmt"
          config: "rustfmt.toml"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: true
    - id: dependency-supply-chain
      question: "Are new crates and npm packages audited for advisories and licenses, are CI actions pinned, and are critical dependencies pinned by hash or lockfile?"
      categories: [dependency-supply-chain]
      authorities: [cargo-deny, cargo-audit, tauri-lifecycle, gh-actions-hardening]
      enforceable_by:
        - tool: "cargo-deny"
          config: "deny.toml"
          coverage: full
        - tool: "cargo-audit"
          config: "Cargo.lock"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: true
    - id: packaging-signing
      question: "Are installers built, signed and notarized per platform (Developer ID plus notarization on macOS, Authenticode on Windows), with entitlements and bundle config reviewed when they change?"
      categories: [packaging-signing, platform-native]
      authorities: [tauri-sign-macos, tauri-sign-windows, apple-notarization, ms-authenticode, tauri-config]
      enforceable_by:
        - tool: "tauri config"
          config: "src-tauri/tauri.conf.json"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: updater-release
      question: "Are updates signed with the updater key, served over TLS, versioned per SemVer, and are release channels and changelogs kept consistent?"
      categories: [updater-release]
      authorities: [tauri-updater, semver, tauri-lifecycle]
      enforceable_by:
        - tool: "tauri updater plugin"
          config: "src-tauri/tauri.conf.json"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: platform-native
      question: "Is native Swift, Objective-C, PowerShell and shell code reviewed for threading, entitlements, and OS API misuse, and is the Rust side of each FFI bridge sound?"
      categories: [platform-native, rust-unsafe]
      authorities: [rustonomicon, apple-notarization, tauri-config]
      enforceable_by: []
      max_maturity: convention
      phase4_absence_is_finding: false
    - id: telemetry-privacy
      question: "Does every new telemetry event match the repository's telemetry policy on what is collected, consent, and redaction?"
      categories: [telemetry-privacy]
      authorities: [berd-telemetry-policy, tauri-lifecycle]
      enforceable_by: []
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: accessibility
      question: "Are new UI elements keyboard-operable, labeled, focus-managed and contrast-checked per WCAG 2.2 as applied to non-web software?"
      categories: [accessibility]
      authorities: [wcag22, wcag2ict, biome-linter]
      enforceable_by:
        - tool: "biome"
          config: "biome.json"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: true
    - id: e2e-ui-coverage
      question: "Do UI changes come with Playwright coverage that uses role-based locators and web-first assertions, runs in CI, and is isolated per test?"
      categories: [e2e-ui-coverage, testing]
      authorities: [playwright-best-practices, biome-domains]
      enforceable_by:
        - tool: "playwright"
          config: "playwright.config.ts"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: true
    - id: functional-defect
      question: "Does the change do what the author intended, including edge cases the reviewer can see and the author missed?"
      categories: [functional-defect, question]
      authorities: [google-looking-for, typescript-strict]
      enforceable_by:
        - tool: "tsc"
          config: "tsconfig.json"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: false
    - id: design-structure
      question: "Is the change in the right place, at the right size, without duplication, and consistent with how the codebase is organized (src/ UI, src-tauri/ core, crates/ shared, bb-cli/ companion)?"
      categories: [design-structure, question]
      authorities: [google-looking-for, tauri-project-structure]
      enforceable_by: []
      max_maturity: convention
      phase4_absence_is_finding: false
    - id: naming
      question: "Do names communicate purpose and follow the language's casing conventions (RFC 430 casing in Rust, camelCase/PascalCase in TypeScript and React)?"
      categories: [naming]
      authorities: [google-looking-for, rust-api-guidelines]
      enforceable_by: []
      max_maturity: convention
      phase4_absence_is_finding: false
    - id: documentation
      question: "Are doc comments, README, changelog and policy documents updated when behavior, interfaces, or telemetry change?"
      categories: [documentation]
      authorities: [google-looking-for, rust-api-guidelines, rust-std-safety-comments]
      enforceable_by: []
      max_maturity: convention
      phase4_absence_is_finding: false
    - id: style
      question: "Is formatting left to Biome and rustfmt, and do reviewers avoid spending comments on it?"
      categories: [style]
      authorities: [biome-linter, rustfmt, lefthook]
      enforceable_by:
        - tool: "biome"
          config: "biome.json"
          coverage: full
        - tool: "rustfmt"
          config: "rustfmt.toml"
          coverage: full
        - tool: "lefthook"
          config: "lefthook.yml"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: false
    - id: testing
      question: "Are unit tests present, correct and useful for the change, and does CI block merge on them?"
      categories: [testing]
      authorities: [google-looking-for, gh-protected-branches]
      enforceable_by:
        - tool: "github-actions"
          config: ".github/workflows/*.yml"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: true
    - id: error-handling
      question: "Are errors typed and propagated rather than unwrapped, and does the UI receive something it can show?"
      categories: [error-handling]
      authorities: [rust-api-guidelines, clippy, typescript-strict]
      enforceable_by:
        - tool: "clippy"
          config: "src-tauri/Cargo.toml [lints] or clippy.toml"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: false
    - id: performance
      question: "Does the change avoid observable cost: unnecessary re-renders, blocking the UI thread, redundant serialization across IPC, allocation in hot loops?"
      categories: [performance]
      authorities: [react-rules, clippy]
      enforceable_by:
        - tool: "clippy"
          config: "src-tauri/Cargo.toml [lints] or clippy.toml"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: false
    - id: security
      question: "Beyond the IPC and capability axes, are secrets, logs, file permissions and CI workflows handled safely?"
      categories: [security]
      authorities: [tauri-security, gh-actions-hardening, tauri-lifecycle]
      enforceable_by: []
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: process
      question: "Does the PR follow the template (summary, related issue, testing evidence with screenshots or recording for UI changes) and keep scope reviewable?"
      categories: [process, other]
      authorities: [lefthook, gh-protected-branches, google-looking-for]
      enforceable_by:
        - tool: "lefthook"
          config: "lefthook.yml"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: false

  tooling_gates:
    - tool: biome
      config_file: "biome.json"
      enforces: [style, react-state-effects, accessibility]
      source: "https://biomejs.dev/linter/"
    - tool: rustfmt
      config_file: "rustfmt.toml"
      enforces: [style]
      source: "https://github.com/rust-lang/rustfmt"
    - tool: clippy
      config_file: "clippy.toml"
      enforces: [rust-api-idiom, rust-unsafe, error-handling, performance]
      source: "https://doc.rust-lang.org/clippy/"
    - tool: cargo-deny
      config_file: "deny.toml"
      enforces: [dependency-supply-chain]
      source: "https://embarkstudios.github.io/cargo-deny/"
    - tool: playwright
      config_file: "playwright.config.ts"
      enforces: [e2e-ui-coverage]
      source: "https://playwright.dev/docs/best-practices"
    - tool: lefthook
      config_file: "lefthook.yml"
      enforces: [style, process]
      source: "https://lefthook.dev/"
    - tool: tauri-capabilities
      config_file: "src-tauri/capabilities/default.json"
      enforces: [capability-scope]
      source: "https://v2.tauri.app/security/capabilities/"
    - tool: tauri-config
      config_file: "src-tauri/tauri.conf.json"
      enforces: [csp-webview, packaging-signing, updater-release]
      source: "https://v2.tauri.app/reference/config/"
    - tool: tsc
      config_file: "tsconfig.json"
      enforces: [functional-defect]
      source: "https://www.typescriptlang.org/tsconfig/#strict"

  prompt_context:
    phase1_pr_extraction: |
      This repository is a Tauri desktop application: a React/TypeScript web view
      (src/) driven by a Rust core (src-tauri/, crates/) with a companion CLI
      (bb-cli/) and native macOS/Windows integration (Swift, Objective-C,
      PowerShell). Classify each review pattern with the lens categories. Prefer
      the specific category (ipc-boundary, capability-scope, csp-webview,
      react-state-effects, rust-unsafe, rust-api-idiom, packaging-signing,
      updater-release, platform-native, telemetry-privacy, accessibility,
      e2e-ui-coverage) over a core category when the comment is about that
      concern. Use the file tag shown next to each inline comment to decide which
      side of the IPC boundary the comment addresses. Cite standards only from the
      lens authority list: Tauri security docs, Rules of React, Biome, Rust API
      Guidelines, Clippy, the Rustonomicon, cargo-deny, Playwright, WCAG 2.2, and
      the platform signing docs. A pattern is deterministic only if a tool
      present in this repository (Biome, rustfmt, Clippy, cargo-deny, Playwright,
      lefthook, GitHub Actions) enforces it.
    phase2_reviewer_fingerprint: |
      Describe each reviewer's focus in this desktop application's terms. Meaningful
      focus areas are: the Rust/webview IPC boundary and command scoping; capability
      and permission manifests; CSP and remote content; React state, effects and
      hook hygiene; unsafe Rust and FFI soundness; idiomatic Rust and Clippy;
      dependency and license auditing; packaging, signing and notarization; the
      signed updater and release channels; native platform code; telemetry and
      privacy; accessibility; and Playwright coverage of UI changes. Note whether a
      reviewer works mostly on src/ (UI), src-tauri/ and crates/ (core), or bb-cli/,
      and whether their comments are findings or questions. A blind spot is an axis
      the reviewer never touches even when the files they comment on are the ones
      where it would arise. Cite only authorities from the lens list.
    phase3_author_growth: |
      Describe growth for a contributor to a Tauri desktop app. Strengths and growth
      areas should be stated as lens axes: for example, learning to scope commands
      and add capability entries, adopting SAFETY comments on unsafe blocks, fixing
      effect dependency arrays, attaching Playwright coverage and recordings to UI
      changes, or handling signing and updater configuration carefully. Support in
      this domain looks like: pairing on the Rust side of the boundary for UI-first
      authors, or on React hooks for Rust-first authors; pointing to the Tauri
      security docs, Rules of React, the Rust API Guidelines and the Rustonomicon;
      and asking for a recording with UI changes. Track whether an author's
      persistent growth areas cluster on one side of the IPC boundary.
    phase4_team_gaps: |
      This is a Tauri desktop application. The named best practices whose absence
      from the review record is itself a finding are: explicit validation and
      scoping of Tauri commands; every exposed command covered by a capability
      file; a restrictive CSP with no remote scripts; Rules of React and exhaustive
      effect dependencies; SAFETY comments on every unsafe block and FFI call;
      Clippy and rustfmt as gates; cargo-deny or cargo-audit for advisories and
      licenses; pinned GitHub Actions and least-privilege tokens; Developer ID
      signing plus notarization on macOS and Authenticode on Windows; a signed,
      TLS-only updater; telemetry that matches TELEMETRY.md; WCAG 2.2 accessibility
      of new UI; and Playwright coverage of UI changes. Type each gap as
      coverage_gap, knowledge_gap or blind_spot. Institutionalization candidates
      are patterns a reviewer keeps raising that Biome, Clippy, cargo-deny,
      Playwright, lefthook or a capability file could enforce instead.
    interpret: |
      Map findings to the lens authorities: Tauri security, IPC, capabilities,
      permissions, scopes, CSP, updater and signing docs; Rules of React and Biome;
      the Rust API Guidelines, Clippy, the Rust Reference on unsafety, the
      Rustonomicon and the std-dev-guide safety-comment policy; cargo-deny and
      cargo-audit; Apple notarization and Microsoft Authenticode; WCAG 2.2 and
      WCAG2ICT; Playwright best practices; SemVer. Domain blind spots are lens axes
      with phase4_absence_is_finding set that no review touched. Quick wins are
      review patterns already at convention or rule that a tool present in the
      repository can make deterministic. Summarize the lens as: a React/TypeScript
      web view over a Rust core, shipped as signed desktop installers, reviewed at
      the IPC boundary, in the capability manifests, and in the packaging and
      update path.

  must_not:
    - "Cite dbt, SQLFluff, Kimball, dbt-project-evaluator, or any data-warehouse practice."
    - "Report gaps about grain, fact models, dimensional modeling, source freshness, incremental models, exposures, or macros."
    - "Recommend Kubernetes manifests, Helm charts, Terraform, or service deployment practices for this application."
    - "Treat CLAUDE.md, AGENTS.md, or .agents/ as evidence that the team builds AI agents."
    - "Describe the companion CLI (bb-cli/) as the primary product."

  validation:
    test_repo: "block/berd"
    expected_selection: true
    expected_score_min: 19
    expected_runner_up: "platform-engineering"
    evidence:
      - axis: ipc-boundary
        evidence: "168 of 471 inline comments are under src-tauri/ and 170 are on .rs files, while 267 are under src/ (131 .tsx, 131 .ts); both sides of the boundary are actively reviewed."
      - axis: capability-scope
        evidence: "src-tauri/ is confirmed from comment paths; Tauri v2 stores capability files under src-tauri/capabilities, so command exposure is reviewable there (4 comments on .json files)."
      - axis: csp-webview
        evidence: "index.html at the repository root and 23,999 bytes of HTML with 88,839 bytes of CSS: a bundled web view whose CSP lives in tauri.conf.json."
      - axis: react-state-effects
        evidence: "131 inline comments on .tsx files and 15.3 MB of TypeScript; biome.json is present, and Biome's react domain auto-enables from package.json."
      - axis: rust-unsafe
        evidence: "170 .rs comments, 76,479 bytes of Objective-C, 28,306 bytes of Swift and 3,434 bytes of C: FFI surface exists where unsafe blocks are needed."
      - axis: rust-api-idiom
        evidence: "3,781,965 bytes of Rust across src-tauri/ and crates/; 1 comment on a .toml file."
      - axis: dependency-supply-chain
        evidence: "pnpm-lock.yaml, acp-tools.lock.json, goose-backend.lock.json and node-runtime.lock.json at the root; 4 comments on .json files."
      - axis: packaging-signing
        evidence: "distro/ directory, 205,723 bytes of PowerShell, 173,036 bytes of Shell, 12 comments on .sh files, 7 on .swift and 4 on .m."
      - axis: updater-release
        evidence: "CHANGELOG.md at the root and a versioned desktop app; the updater plugin's signature requirement applies to every release."
      - axis: platform-native
        evidence: "7 comments on .swift and 4 on .m files; Swift, Objective-C and PowerShell bytes present."
      - axis: telemetry-privacy
        evidence: "TELEMETRY.md at the repository root is a repository-local policy reviewers can hold changes to."
      - axis: accessibility
        evidence: "131 .tsx comments on a user-facing UI; no a11y-specific comment is visible in the histogram, which is why absence is a finding."
      - axis: e2e-ui-coverage
        evidence: "playwright.config.ts and playwright.table-overflow.config.ts at the root; the PR template requires before/after screenshots or a recording for UI changes."
      - axis: testing
        evidence: "PR template has a Testing section; CI present under .github/ (2 comments on .github/ paths, 2 on .yml)."
      - axis: process
        evidence: "PR template with Summary, Related issue, Testing sections; lefthook.yml present; 4 comments on .md and 4 under LAWS/."
    smoke_checks:
      - "grain"
      - "fact model"
      - "dbt"
      - "SQLFluff"
      - "Kimball"
      - "source freshness"
      - "dimensional model"
      - "Helm chart"
      - "Kubernetes"
      - "data warehouse"
