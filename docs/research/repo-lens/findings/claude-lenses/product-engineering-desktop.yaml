# Lens: product-engineering-desktop
# Source: Claude (independent pass, Claude Code subagent), 2026-09-03
# Schema: docs/research/repo-lens/handoff-prompt.md, Part 4, Artifact B.
# Signal-weight semantics are defined in detection-rubric.yaml (each pattern
# contributes its weight at most once, regardless of how many files match).

lens:
  name: product-engineering-desktop
  version: 1
  status: experimental
  extends: product-engineering
  domain: >-
    A desktop application whose user interface is a web view (React/TypeScript
    here) driven by a native core written in Rust, packaged with Tauri and shipped
    as signed installers for macOS, Windows and Linux. Review concerns a service
    lens misses: the IPC boundary between the web view and the Rust core, the
    capability and permission manifests that scope that boundary, Content
    Security Policy for the web view, unsafe Rust and FFI into platform code
    (Swift, Objective-C, PowerShell), code signing, notarization and the signed
    updater, release channels, telemetry consent, accessibility of the UI, and
    end-to-end tests that exercise the UI the way a user would.

  detection:
    signals:
      - pattern: "src-tauri/tauri.conf.json"
        weight: 10
        rationale: "Tauri's primary configuration file; the Tauri docs call it the marker file the Tauri CLI looks for."
        source: "https://v2.tauri.app/start/project-structure/"
      - pattern: "src-tauri/**"
        weight: 8
        rationale: "The Rust half of a Tauri project lives in src-tauri/ by convention; the directory alone is strong evidence even when the config file is not enumerated."
        source: "https://v2.tauri.app/start/project-structure/"
      - pattern: "src-tauri/capabilities/**"
        weight: 3
        rationale: "Capability files are defined inside src-tauri/capabilities; their presence confirms a Tauri v2 permission model is in use."
        source: "https://v2.tauri.app/security/capabilities/"
      - pattern: "src-tauri/Cargo.toml"
        weight: 3
        rationale: "The Rust project in src-tauri/ is a standard Cargo project."
        source: "https://v2.tauri.app/start/project-structure/"
      - pattern: "**/tauri.{linux,windows,macos}.conf.json"
        weight: 3
        rationale: "Platform-specific Tauri config files are merged into the main configuration; they only exist for multi-platform desktop targets."
        source: "https://v2.tauri.app/reference/config/"
      - pattern: "{electron-builder.yml,electron-builder.json,forge.config.js,forge.config.ts}"
        weight: 8
        rationale: "Electron packaging config identifies the other common web-view desktop shell. Included so the lens is not Tauri-only; weight is a placeholder pending a primary citation (see Open gaps)."
        source: "none found (see findings Q1 open gaps)"
      - pattern: "**/*.entitlements"
        weight: 3
        rationale: "macOS entitlements files accompany Hardened Runtime and notarization, which Apple requires for Developer ID distribution."
        source: "https://developer.apple.com/documentation/security/notarizing-macos-software-before-distribution"
      - pattern: "**/*.{wxs,nsi}"
        weight: 3
        rationale: "WiX and NSIS installer sources exist only for Windows desktop packaging."
        source: "https://v2.tauri.app/distribute/sign/windows/"
      - pattern: "**/*.swift"
        weight: 2
        rationale: "Native macOS code alongside a web-view app indicates platform integration a pure web app would not carry."
        source: "https://v2.tauri.app/reference/config/"
      - pattern: "**/*.m"
        weight: 2
        rationale: "Objective-C alongside a web-view app indicates macOS platform integration. Note .m is ambiguous (MATLAB) in Linguist; weight kept low."
        source: "https://github.com/github-linguist/linguist/blob/main/docs/how-linguist-works.md"
      - pattern: "distro/**"
        weight: 2
        rationale: "Repository-specific packaging directory observed in the test case; low weight because the name is not a published convention."
        source: "none found (repository-specific; see findings Q7)"
      - pattern: "playwright.config.ts"
        weight: 2
        rationale: "Browser-driven end-to-end tests; shared with web front-ends, so weak on its own."
        source: "https://playwright.dev/docs/best-practices"
      - pattern: "index.html"
        weight: 2
        rationale: "A root index.html plus package.json is the static-site shape Tauri bundles into the binary; weak on its own because ordinary web apps share it."
        source: "https://v2.tauri.app/start/project-structure/"
      - pattern: "biome.json"
        weight: 1
        rationale: "TypeScript/JavaScript toolchain presence; near-zero discriminating power across product sub-profiles."
        source: "https://biomejs.dev/linter/"
    counter_signals:
      - pattern: "dbt_project.yml"
        weight: -10
        rationale: "dbt project root; a data-modeling repository, not a desktop app."
      - pattern: "**/*.tf"
        weight: -4
        rationale: "Terraform sources indicate infrastructure ownership; a desktop app repo rarely carries more than a token amount (the test case has 60 bytes of HCL)."
      - pattern: "{helm,charts,k8s,kubernetes,manifests}/**"
        weight: -4
        rationale: "Deployment manifests belong to services, not installed desktop applications."
      - pattern: "{Chart.yaml,docker-compose.yml,docker-compose.yaml}"
        weight: -2
        rationale: "Service composition. Low weight: desktop repos sometimes carry compose files for build tooling."
      - pattern: "**/*.{xcodeproj,pbxproj}"
        weight: -3
        rationale: "A native Xcode project as the primary build indicates a native (non-web-view) app; belongs to a mobile or native-desktop sub-profile."
    ignore_for_detection:
      - "CLAUDE.md"
      - "CLAUDE.local.md"
      - ".claude/**"
      - "AGENTS.md"
      - "**/AGENTS.md"
      - ".agents/**"
      - ".cursor/**"
      - ".cursorrules"
      - ".github/copilot-instructions.md"
      - ".windsurf/**"
      - ".windsurfrules"
      - ".clinerules"
      - ".devin/**"
      - "GEMINI.md"
      - ".gemini/**"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "GOVERNANCE.md"
      - "CODEOWNERS"
      - ".github/CODEOWNERS"
      - "LICENSE"
      - "LICENCE"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "node_modules/**"
      - "**/node_modules/**"
      - "dist/**"
      - "vendor/**"
      - "target/**"
    min_score: 10
    min_margin: 5
    composition_check:
      languages_expected: [TypeScript, Rust, JavaScript, Swift, Objective-C, PowerShell, Shell, CSS, HTML]
      languages_unexpected: [SQL, HCL, Go, Java, Kotlin]
    review_path_check:
      min_share_of_comments_on_tagged_paths: 0.7

  file_tags:
    - glob: "src-tauri/capabilities/**"
      tag: "capability-manifest"
    - glob: "src-tauri/tauri.conf.json"
      tag: "tauri-config"
    - glob: "src-tauri/**/*.rs"
      tag: "desktop-core-rust"
    - glob: "src-tauri/**/*.{swift,m,h}"
      tag: "platform-native"
    - glob: "crates/**/*.rs"
      tag: "shared-rust-crate"
    - glob: "bb-cli/**"
      tag: "companion-cli"
    - glob: "**/*.{test,spec}.{ts,tsx}"
      tag: "test-unit"
    - glob: "**/e2e/**"
      tag: "test-e2e"
    - glob: "playwright*.config.ts"
      tag: "test-e2e"
    - glob: "src/**/*.tsx"
      tag: "ui-react"
    - glob: "src/**/*.{ts,mjs,js}"
      tag: "ui-typescript"
    - glob: "src/**/*.css"
      tag: "ui-style"
    - glob: "**/*.{swift,m,h}"
      tag: "platform-native"
    - glob: "**/*.{ps1,psm1}"
      tag: "platform-native"
    - glob: "{distro,docker}/**"
      tag: "packaging"
    - glob: "scripts/**"
      tag: "build-script"
    - glob: "**/*.sh"
      tag: "build-script"
    - glob: "justfile"
      tag: "build-script"
    - glob: ".github/**"
      tag: "ci"
    - glob: "lefthook.yml"
      tag: "ci"
    - glob: "{biome.json,tsconfig*.json,postcss.config.js,rustfmt.toml,clippy.toml,deny.toml}"
      tag: "tool-config"
    - glob: "**/*.lock.json"
      tag: "dependency-lock"
    - glob: "{pnpm-lock.yaml,Cargo.lock}"
      tag: "dependency-lock"
    - glob: "{TELEMETRY.md,SECURITY.md,PRODUCT.md,DESIGN.md}"
      tag: "policy-doc"
    - glob: "LAWS/**"
      tag: "policy-doc"
    - glob: "docs/**"
      tag: "docs"
    - glob: "**/*.md"
      tag: "docs"

  # Domain-neutral core (core: true) is identical in platform-engineering.yaml.
  categories:
    - id: functional-defect
      core: true
      description: "The change does not do what it intends: wrong logic, missed edge case, unchecked return, resource leak, race, wrong interface use."
      example_comment: "If the workspace path has a trailing slash this strip_prefix returns None and we silently fall through; handle it."
      axes: [functional-defect]
    - id: design-structure
      core: true
      description: "Organization and solution approach: where code lives, duplication, complexity, module boundaries, whether the change belongs here at all."
      example_comment: "This duplicates the session-lookup logic in session.rs; pull it into one helper so the two paths cannot drift."
      axes: [design-structure]
    - id: naming
      core: true
      description: "Identifiers, file names, and messages that do not communicate what the thing is or does, or violate the language's casing convention."
      example_comment: "`data2` does not say what it holds; call it `pending_messages`."
      axes: [naming]
    - id: documentation
      core: true
      description: "Missing or misleading comments, doc comments, README or changelog updates for a change that alters behavior or interface."
      example_comment: "This command changes what the frontend can pass in; document the new argument in the doc comment and the changelog."
      axes: [documentation]
    - id: style
      core: true
      description: "Formatting and visual layout that a formatter or linter would normalize."
      example_comment: "Run cargo fmt; the match arms are misaligned."
      axes: [style]
    - id: testing
      core: true
      description: "Missing, incorrect, or unconvincing tests; test structure; flakiness; test data."
      example_comment: "Add a test for the empty-transcript case; the PR only covers the happy path."
      axes: [testing, e2e-ui-coverage]
    - id: error-handling
      core: true
      description: "How failures are represented, propagated, logged, retried, and surfaced; crashes or aborts on reachable paths."
      example_comment: "This unwrap will panic if the model server is down; return an error the UI can show instead."
      axes: [error-handling]
    - id: performance
      core: true
      description: "Unnecessary work, allocation, blocking, or resource use with observable cost."
      example_comment: "This re-serializes the whole conversation on every keystroke; memoize or diff it."
      axes: [performance, react-state-effects]
    - id: security
      core: true
      description: "Vulnerabilities and unsafe trust assumptions not covered by a more specific category."
      example_comment: "The API key is being written to the debug log at info level; redact it."
      axes: [security]
    - id: dependency-supply-chain
      core: true
      description: "Adding, upgrading, pinning, licensing, or auditing third-party dependencies and CI actions."
      example_comment: "This crate pulls in openssl-sys; we standardized on rustls, and cargo-deny will flag the duplicate."
      axes: [dependency-supply-chain]
    - id: process
      core: true
      description: "PR hygiene: description, scope, evidence required by the template, changelog, commit structure."
      example_comment: "The template asks for a before/after recording for UI changes; please attach one."
      axes: [process]
    - id: question
      core: true
      description: "A request for understanding rather than a finding; the reviewer is asking what or why."
      example_comment: "Why does this need to run on the main thread? Is it the webview handle?"
      axes: [design-structure]
    - id: other
      core: true
      description: "Does not fit any category; must be rare, and frequent use indicates the lens is wrong."
      example_comment: "Unrelated to this change, but the CI badge in the README is stale."
      axes: [process]
    - id: ipc-boundary
      description: "Data crossing the Rust/webview boundary: command argument validation, serialization shape, scoping of paths and URLs, event payload trust."
      example_comment: "This command accepts an arbitrary path from the frontend; resolve and check it against the workspace scope before reading."
      axes: [ipc-boundary]
    - id: capability-scope
      description: "Capability and permission manifests: which windows or webviews may call which commands, allow/deny scopes, plugin permission sets."
      example_comment: "The new command is not in any capability file, so this only works because the default capability is too broad; add an explicit permission."
      axes: [capability-scope]
    - id: csp-webview
      description: "Content Security Policy and remote content in the webview: script sources, wasm-unsafe-eval, loading remote assets, isolation pattern."
      example_comment: "Adding the CDN host to script-src widens the CSP for every window; bundle the library instead."
      axes: [csp-webview]
    - id: react-state-effects
      description: "React purity and hook rules: effect dependencies, state derived in render, side effects during render, keys, component identity."
      example_comment: "This effect reads `sessionId` but it is missing from the dependency array; it will keep the stale id after switching sessions."
      axes: [react-state-effects]
    - id: rust-unsafe
      description: "unsafe blocks, FFI into Swift/Objective-C/Win32, raw pointers, and whether the safety invariant is stated and upheld."
      example_comment: "Add a `// SAFETY:` comment explaining why this pointer outlives the callback; otherwise this is unsound if the window closes first."
      axes: [rust-unsafe]
    - id: rust-api-idiom
      description: "Idiomatic Rust per the API Guidelines and Clippy: ownership, conversions, trait impls, error types, clippy warnings."
      example_comment: "Return `impl Iterator` rather than collecting into a Vec the caller immediately iterates."
      axes: [rust-api-idiom]
    - id: packaging-signing
      description: "Bundling, code signing, notarization, installer configuration, entitlements, platform build scripts."
      example_comment: "The PowerShell installer step runs unsigned; SmartScreen will warn until the certificateThumbprint is set in the bundle config."
      axes: [packaging-signing]
    - id: updater-release
      description: "Updater endpoints and signatures, release channels, version bumps and semantic versioning, changelog for releases."
      example_comment: "This bumps the version but the updater manifest URL still points at the beta channel."
      axes: [updater-release]
    - id: platform-native
      description: "Swift, Objective-C, PowerShell and shell code that integrates with the host OS: entitlements, keychain, notifications, window management."
      example_comment: "This Swift bridge calls into AppKit off the main thread; dispatch to main before touching NSWindow."
      axes: [platform-native]
    - id: telemetry-privacy
      description: "What is collected, when consent is obtained, what is redacted, and whether behavior matches the repository's telemetry policy."
      example_comment: "This adds the full prompt text to the telemetry event; TELEMETRY.md says we only send event names and counts."
      axes: [telemetry-privacy]
    - id: accessibility
      description: "Keyboard operability, focus management, labels and roles, contrast, and screen-reader behavior of the UI."
      example_comment: "The new icon button has no accessible name; add aria-label so screen readers announce it."
      axes: [accessibility]
    - id: e2e-ui-coverage
      description: "Playwright coverage of UI changes: locators, web-first assertions, isolation, flakiness, CI execution."
      example_comment: "Use getByRole('button', { name: 'Send' }) rather than the CSS class; the class changes with the theme."
      axes: [e2e-ui-coverage]

