  axes:
    - id: container-image
      question: "Are images built from pinned minimal bases with multi-stage builds, a non-root user, cache-friendly layer order and no secrets baked in?"
      categories: [container-image, performance]
      authorities: [docker-best-practices, hadolint]
      enforceable_by:
        - tool: "hadolint"
          config: ".hadolint.yaml"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: true
    - id: k8s-manifest
      question: "Do manifests use stable API versions, set requests and limits, define probes, use labels, avoid naked pods and avoid :latest image tags?"
      categories: [k8s-manifest]
      authorities: [k8s-config-good-practices]
      enforceable_by: []
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: iac-terraform
      question: "Is Terraform formatted and validated, are modules and providers version-pinned, do variables and outputs have types and descriptions, and is state kept out of the repo?"
      categories: [iac-terraform, naming, documentation]
      authorities: [terraform-style]
      enforceable_by:
        - tool: "terraform fmt"
          config: "*.tf"
          coverage: partial
        - tool: "terraform validate"
          config: "*.tf"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: true
    - id: ci-workflow-security
      question: "Are actions pinned to full commit SHAs, are GITHUB_TOKEN permissions least-privilege, is untrusted input kept out of shell interpolation, and is OIDC used instead of long-lived cloud secrets?"
      categories: [ci-workflow-security, dependency-supply-chain]
      authorities: [gh-actions-hardening, ossf-scorecard-checks]
      enforceable_by:
        - tool: "openssf-scorecard"
          config: ".github/workflows/scorecard.yml"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: true
    - id: supply-chain-provenance
      question: "Are release artifacts built on a hosted platform with signed provenance, and are dependencies pinned and updated by tooling?"
      categories: [supply-chain-provenance, dependency-supply-chain]
      authorities: [slsa-levels, ossf-scorecard-checks]
      enforceable_by:
        - tool: "openssf-scorecard"
          config: ".github/workflows/scorecard.yml"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: true
    - id: workload-least-privilege
      question: "Do service accounts, RBAC, IAM policies and network policies grant only what the workload needs?"
      categories: [workload-least-privilege, security, k8s-manifest]
      authorities: [owasp-asvs, k8s-config-good-practices]
      enforceable_by: []
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: secrets-config
      question: "Are secrets kept out of the repository, logs and image layers, and read from a secrets manager or masked at runtime?"
      categories: [secrets-config]
      authorities: [terraform-style, gh-actions-hardening, owasp-asvs]
      enforceable_by: []
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: observability
      question: "Does the change expose latency, traffic, errors and saturation for the component it touches, with alerts on the ones that page?"
      categories: [observability]
      authorities: [sre-golden-signals]
      enforceable_by: []
      max_maturity: convention
      phase4_absence_is_finding: true
    - id: reliability-rollout
      question: "Can the change be rolled out and rolled back safely: probes, backward-compatible migrations, timeouts, retries with caps, canaries?"
      categories: [reliability-rollout, error-handling]
      authorities: [sre-golden-signals, k8s-config-good-practices]
      enforceable_by: []
      max_maturity: convention
      phase4_absence_is_finding: true
    - id: api-contract
      question: "Do API changes keep the OpenAPI document accurate and follow SemVer for breaking changes?"
      categories: [api-contract]
      authorities: [openapi-spec, semver]
      enforceable_by: []
      max_maturity: rule
      phase4_absence_is_finding: false
    - id: functional-defect
      question: "Does the change do what the author intended, including edge cases the reviewer can see and the author missed?"
      categories: [functional-defect, question]
      authorities: [google-looking-for]
      enforceable_by: []
      max_maturity: judgment
      phase4_absence_is_finding: false
    - id: design-structure
      question: "Is the change in the right place, at the right size, without duplication, and consistent with how the repository is organized?"
      categories: [design-structure, question]
      authorities: [google-looking-for, terraform-style]
      enforceable_by: []
      max_maturity: convention
      phase4_absence_is_finding: false
    - id: naming
      question: "Do resource, variable and module names communicate purpose and follow the tool's convention (descriptive nouns, underscores, no type in the identifier)?"
      categories: [naming]
      authorities: [terraform-style, google-looking-for]
      enforceable_by: []
      max_maturity: convention
      phase4_absence_is_finding: false
    - id: documentation
      question: "Are variables, outputs, manifests and runbooks documented when behavior or interfaces change?"
      categories: [documentation]
      authorities: [terraform-style, k8s-config-good-practices, google-looking-for]
      enforceable_by: []
      max_maturity: convention
      phase4_absence_is_finding: false
    - id: style
      question: "Is formatting left to terraform fmt and equivalent formatters rather than review comments?"
      categories: [style]
      authorities: [terraform-style]
      enforceable_by:
        - tool: "terraform fmt"
          config: "*.tf"
          coverage: full
      max_maturity: deterministic
      phase4_absence_is_finding: false
    - id: testing
      question: "Are tests present and useful, and does CI block merge on them?"
      categories: [testing]
      authorities: [google-looking-for, gh-protected-branches, ossf-scorecard-checks]
      enforceable_by:
        - tool: "github-actions"
          config: ".github/workflows/*.yml"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: true
    - id: error-handling
      question: "Are failures represented, retried with caps, timed out, and surfaced with enough context to act on?"
      categories: [error-handling]
      authorities: [sre-golden-signals, google-looking-for]
      enforceable_by: []
      max_maturity: convention
      phase4_absence_is_finding: false
    - id: performance
      question: "Does the change avoid observable cost in build time, image size, or runtime resource use?"
      categories: [performance]
      authorities: [docker-best-practices]
      enforceable_by:
        - tool: "hadolint"
          config: ".hadolint.yaml"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: false
    - id: security
      question: "Beyond least privilege and secrets, does the change follow ASVS controls for the service it configures (input handling, auth, configuration)?"
      categories: [security]
      authorities: [owasp-asvs, gh-actions-hardening]
      enforceable_by: []
      max_maturity: rule
      phase4_absence_is_finding: true
    - id: dependency-supply-chain
      question: "Are dependencies and CI actions pinned, audited and updated by tooling?"
      categories: [dependency-supply-chain]
      authorities: [ossf-scorecard-checks, gh-actions-hardening]
      enforceable_by:
        - tool: "openssf-scorecard"
          config: ".github/workflows/scorecard.yml"
          coverage: partial
      max_maturity: deterministic
      phase4_absence_is_finding: true
    - id: process
      question: "Does the PR carry a rollout and rollback note for production-affecting changes, get review from the owning team, and pass required checks?"
      categories: [process, other]
      authorities: [gh-protected-branches, codeowners, google-looking-for]
      enforceable_by:
        - tool: "github branch protection"
          config: "repository settings (not a file)"
          coverage: partial
      max_maturity: rule
      phase4_absence_is_finding: false

  tooling_gates:
    - tool: hadolint
      config_file: ".hadolint.yaml"
      enforces: [container-image, performance]
      source: "https://github.com/hadolint/hadolint"
    - tool: terraform-fmt
      config_file: ".terraform-version"
      enforces: [style, iac-terraform]
      source: "https://developer.hashicorp.com/terraform/language/style"
    - tool: openssf-scorecard
      config_file: ".github/workflows/scorecard.yml"
      enforces: [ci-workflow-security, supply-chain-provenance, dependency-supply-chain]
      source: "https://github.com/ossf/scorecard/blob/main/docs/checks.md"

  prompt_context:
    phase1_pr_extraction: |
      This repository owns infrastructure and delivery: container images,
      Kubernetes manifests or Helm charts, Terraform, CI workflows, deployment
      tooling and the observability around services. Classify each review pattern
      with the lens categories, preferring the specific ones (container-image,
      k8s-manifest, iac-terraform, ci-workflow-security, supply-chain-provenance,
      workload-least-privilege, secrets-config, observability, reliability-rollout,
      api-contract) over a core category when the comment is about that concern.
      Use the file tag next to each inline comment to tell an image definition
      from a manifest from a workflow. Cite standards only from the lens authority
      list: Docker build best practices, hadolint, Kubernetes configuration
      guidance, the Terraform style guide, GitHub Actions security hardening, SLSA,
      OpenSSF Scorecard, the SRE book's golden signals, OWASP ASVS, OpenAPI and
      SemVer. A pattern is deterministic only if a tool present in this repository
      (hadolint, terraform fmt/validate, Scorecard, CI checks) enforces it.
    phase2_reviewer_fingerprint: |
      Describe each reviewer's focus in platform terms. Meaningful focus areas are:
      image hygiene and layer caching; manifest correctness, probes, requests and
      limits; Terraform structure, pinning and state; CI workflow security (pinned
      actions, token permissions, injection); provenance and signed releases;
      least privilege for workloads and IAM; secrets handling; golden-signal
      observability; rollout and rollback safety; and API contract compatibility.
      Note which artifact types a reviewer comments on (images, manifests,
      workflows, IaC, service code) and whether their comments are findings or
      questions. A blind spot is an axis the reviewer never raises on the artifact
      types where it would arise. Cite only authorities from the lens list.
    phase3_author_growth: |
      Describe growth for a contributor to infrastructure and delivery code.
      Strengths and growth areas should be stated as lens axes: for example,
      learning to pin base images and actions, to set requests, limits and probes,
      to keep secrets out of tfvars and layers, to add golden-signal metrics with
      a new endpoint, or to sequence migrations for safe rollout. Support in this
      domain looks like: pairing on a first Terraform module or Helm chart,
      pointing to the Terraform style guide, Docker best practices, the Kubernetes
      configuration guidance and GitHub's Actions hardening guide, and reviewing a
      rollout plan before it reaches production. Track whether an author's
      persistent growth areas cluster on one artifact type.
    phase4_team_gaps: |
      This repository owns infrastructure and delivery. The named best practices
      whose absence from the review record is itself a finding are: digest-pinned
      minimal base images with non-root users; manifests with stable API
      versions, requests, limits, probes and versioned image tags; Terraform that
      is formatted, validated, version-pinned and documented with state kept out
      of the repo; workflows with SHA-pinned actions, least-privilege tokens and
      no untrusted interpolation; signed provenance for released artifacts;
      least-privilege RBAC and IAM; secrets in a manager rather than the repo;
      latency, traffic, error and saturation signals for changed components; and
      safe rollout and rollback sequencing. Type each gap as coverage_gap,
      knowledge_gap or blind_spot. Institutionalization candidates are patterns a
      reviewer keeps raising that hadolint, terraform fmt/validate, Scorecard, a
      policy check or a required CI status could enforce instead.
    interpret: |
      Map findings to the lens authorities: Docker build best practices and
      hadolint; Kubernetes configuration guidance; the Terraform style guide;
      GitHub Actions security hardening and branch protection; SLSA build levels
      and OpenSSF Scorecard checks; the SRE book's four golden signals; OWASP ASVS;
      OpenAPI and SemVer. Domain blind spots are lens axes with
      phase4_absence_is_finding set that no review touched. Quick wins are review
      patterns already at convention or rule that a tool present in the repository
      can make deterministic. Summarize the lens as: infrastructure and delivery
      code reviewed for image and manifest hygiene, pinned and provenance-bearing
      builds, least privilege, secrets, observability, and rollout safety.

  must_not:
    - "Cite dbt, SQLFluff, Kimball, dbt-project-evaluator, or any data-warehouse practice."
    - "Report gaps about grain, fact models, dimensional modeling, source freshness, incremental models, exposures, or macros."
    - "Recommend Tauri capabilities, code signing, notarization, or app updaters unless the repository ships a desktop application."
    - "Treat CLAUDE.md, AGENTS.md, or .agents/ as evidence that the team builds AI agents."
    - "Treat a Dockerfile used only to build CI images as evidence that the repository is a service."

  validation:
    test_repo: "block/berd"
    expected_selection: false
    expected_score_min: 0
    expected_runner_up: "product-engineering-desktop"
    evidence:
      - axis: container-image
        evidence: "Berd has 2,561 bytes of Dockerfile under docker/ (one **/Dockerfile match, +4) and 60 bytes of HCL (+2 via **/*.hcl only if a .hcl file exists; not confirmed). Counter-signal src-tauri/** (-6) drives the total to at most 0, below min_score 10, so this lens must not be selected for the test repo."
    smoke_checks:
      - "grain"
      - "fact model"
      - "dbt"
      - "SQLFluff"
      - "Kimball"
      - "source freshness"
      - "tauri.conf.json"
      - "notarization"
      - "data warehouse"
