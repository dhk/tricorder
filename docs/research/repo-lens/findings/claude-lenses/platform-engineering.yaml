      name: "Building best practices (Dockerfile)"
      publisher: "Docker Inc. (docs.docker.com)"
      url: "https://docs.docker.com/build/building/best-practices/"
      kind: primary
      retrieved: 2026-09-03
      covers: [container-image, performance, security]
    - id: hadolint
      name: "hadolint: Dockerfile linter"
      publisher: "hadolint maintainers"
      url: "https://github.com/hadolint/hadolint"
      kind: primary
      retrieved: 2026-09-03
      covers: [container-image]
    - id: k8s-config-good-practices
      name: "Kubernetes: Configuration Best Practices"
      publisher: "The Kubernetes Authors"
      url: "https://kubernetes.io/docs/concepts/configuration/overview/"
