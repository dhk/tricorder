# Lens: platform-engineering
# Source: Claude (independent pass, Claude Code subagent), 2026-09-03
# Schema: docs/research/repo-lens/handoff-prompt.md, Part 4, Artifact B.
# Signal-weight semantics are defined in detection-rubric.yaml.

lens:
  name: platform-engineering
  version: 1
  status: experimental
  domain: >-
    A repository whose primary artifacts are the infrastructure, delivery
    pipeline and runtime configuration for services: container images,
    Kubernetes manifests or Helm charts, Terraform or other infrastructure as
    code, CI/CD workflow definitions, deployment and rollout tooling, and the
    observability and reliability configuration around them. Reviewers here
    care about image hygiene, least privilege in workloads and CI tokens,
    reproducible and pinned builds, provenance and signing of artifacts,
    secrets handling, monitoring of the four golden signals, API contracts and
    versioning of anything other teams consume, and whether a change can be
    rolled out and rolled back safely.

  detection:
    signals:
      - pattern: "**/*.tf"
        weight: 6
        rationale: "Terraform configuration is the clearest infrastructure-as-code indicator; the HashiCorp style guide defines its review conventions."
        source: "https://developer.hashicorp.com/terraform/language/style"
      - pattern: "{terraform,infra,infrastructure}/**"
        weight: 3
        rationale: "Conventional IaC directories; weaker than the .tf files themselves."
        source: "https://developer.hashicorp.com/terraform/language/style"
      - pattern: "**/Chart.yaml"
        weight: 6
        rationale: "Helm chart root; a packaged Kubernetes deployment. Weight placeholder pending a Helm primary citation (see Open gaps)."
        source: "none found (see findings Q1 open gaps)"
      - pattern: "{k8s,kubernetes,manifests,deploy,deployment}/**/*.{yaml,yml}"
        weight: 5
        rationale: "Kubernetes resource manifests kept in version control, as the Kubernetes configuration guidance recommends."
        source: "https://kubernetes.io/docs/concepts/configuration/overview/"
      - pattern: "**/Dockerfile"
        weight: 4
        rationale: "Container image definition. Medium weight: desktop and library repos also carry Dockerfiles for CI images (the test case has one under docker/)."
        source: "https://docs.docker.com/build/building/best-practices/"
      - pattern: "**/*.Dockerfile"
        weight: 3
        rationale: "Multiple named image definitions indicate image ownership rather than a build convenience."
        source: "https://docs.docker.com/build/building/best-practices/"
      - pattern: "{docker-compose.yml,docker-compose.yaml,compose.yml,compose.yaml}"
        weight: 3
        rationale: "Multi-service composition for local or test environments."
        source: "https://docs.docker.com/build/building/best-practices/"
      - pattern: "**/*.hcl"
        weight: 2
        rationale: "HCL outside .tf files (Packer, Nomad, Vault) still indicates infrastructure tooling; low weight because of small incidental files (60 bytes in the test case)."
        source: "https://developer.hashicorp.com/terraform/language/style"
      - pattern: "{ansible,playbooks}/**"
        weight: 4
        rationale: "Configuration management. Weight placeholder pending an Ansible primary citation (see Open gaps)."
        source: "none found (see findings Q1 open gaps)"
      - pattern: "{openapi,swagger}.{yaml,yml,json}"
        weight: 4
        rationale: "An HTTP API contract in the OpenAPI format identifies a service repository or platform API."
        source: "https://spec.openapis.org/oas/latest.html"
      - pattern: "**/openapi/**"
        weight: 2
        rationale: "OpenAPI documents in a directory; weaker than a root contract file."
        source: "https://spec.openapis.org/oas/latest.html"
      - pattern: "go.mod"
        weight: 2
        rationale: "Go is common for platform tooling, but go.mod only marks a Go module root; it does not by itself say what the module is."
        source: "https://go.dev/ref/mod#go-mod-file"
      - pattern: "{Procfile,serverless.yml,Pulumi.yaml,skaffold.yaml,kustomization.yaml}"
        weight: 4
        rationale: "Deployment descriptors for PaaS, serverless, Pulumi, Skaffold or Kustomize. Weight placeholder pending primary citations (see Open gaps)."
        source: "none found (see findings Q1 open gaps)"
      - pattern: ".hadolint.yaml"
        weight: 2
        rationale: "A Dockerfile linter config indicates the team treats images as first-class reviewed artifacts."
        source: "https://github.com/hadolint/hadolint"
    counter_signals:
      - pattern: "src-tauri/tauri.conf.json"
        weight: -8
        rationale: "A Tauri desktop application; container files there are build tooling, not the product."
      - pattern: "src-tauri/**"
        weight: -6
        rationale: "Tauri Rust core directory; the repository is a desktop app."
      - pattern: "dbt_project.yml"
        weight: -10
        rationale: "dbt project root; analytics engineering."
      - pattern: "**/*.{xcodeproj,pbxproj}"
        weight: -4
        rationale: "Native Apple app project."
      - pattern: "{electron-builder.yml,forge.config.js,forge.config.ts}"
        weight: -6
        rationale: "Electron desktop packaging."
    ignore_for_detection:
      - "CLAUDE.md"
      - "CLAUDE.local.md"
      - ".claude/**"
      - "AGENTS.md"
      - "**/AGENTS.md"
      - ".agents/**"
      - ".cursor/**"
      - ".cursorrules"
      - ".github/copilot-instructions.md"
      - ".windsurf/**"
      - ".windsurfrules"
      - ".clinerules"
      - ".devin/**"
      - "GEMINI.md"
      - ".gemini/**"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "GOVERNANCE.md"
      - "CODEOWNERS"
      - ".github/CODEOWNERS"
      - "LICENSE"
      - "LICENCE"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "node_modules/**"
      - "**/node_modules/**"
      - "dist/**"
      - "vendor/**"
      - "target/**"
    min_score: 10
    min_margin: 5
    composition_check:
      languages_expected: [HCL, Dockerfile, Shell, Go, Python, YAML, Makefile, Smarty]
      languages_unexpected: [Swift, Objective-C, SQL, Kotlin, TSX]
    review_path_check:
      min_share_of_comments_on_tagged_paths: 0.7

  file_tags:
    - glob: "**/*.tf"
      tag: "iac-terraform"
    - glob: "**/*.tfvars"
      tag: "iac-terraform"
    - glob: "**/*.hcl"
      tag: "iac-hcl"
    - glob: "**/Chart.yaml"
      tag: "helm-chart"
    - glob: "**/charts/**"
      tag: "helm-chart"
    - glob: "**/templates/**/*.{yaml,yml,tpl}"
      tag: "helm-chart"
    - glob: "{k8s,kubernetes,manifests,deploy,deployment}/**"
      tag: "k8s-manifest"
    - glob: "**/kustomization.yaml"
      tag: "k8s-manifest"
    - glob: "**/Dockerfile"
      tag: "container-image"
    - glob: "**/*.Dockerfile"
      tag: "container-image"
    - glob: "**/.dockerignore"
      tag: "container-image"
    - glob: "{docker-compose,compose}.{yml,yaml}"
      tag: "container-compose"
    - glob: ".github/workflows/**"
      tag: "ci-workflow"
    - glob: "{.gitlab-ci.yml,Jenkinsfile,.circleci/**}"
      tag: "ci-workflow"
    - glob: "{ansible,playbooks}/**"
      tag: "config-mgmt"
    - glob: "{openapi,swagger}.{yaml,yml,json}"
      tag: "api-contract"
    - glob: "**/openapi/**"
      tag: "api-contract"
    - glob: "**/*.proto"
      tag: "api-contract"
    - glob: "{monitoring,observability,alerts,dashboards}/**"
      tag: "observability"
    - glob: "**/*_test.go"
      tag: "test"
    - glob: "**/test*/**"
      tag: "test"
    - glob: "**/*.{test,spec}.{ts,js,py}"
      tag: "test"
    - glob: "**/*.go"
      tag: "service-go"
    - glob: "**/*.py"
      tag: "service-python"
    - glob: "**/*.{ts,js}"
      tag: "service-typescript"
    - glob: "**/*.sh"
      tag: "script"
    - glob: "{Makefile,justfile}"
      tag: "script"
    - glob: "{go.mod,go.sum,pyproject.toml,package.json,pnpm-lock.yaml,package-lock.json}"
      tag: "dependency-manifest"
    - glob: "docs/**"
      tag: "docs"
    - glob: "**/*.md"
      tag: "docs"

  # Domain-neutral core (core: true) is identical in product-engineering-desktop.yaml.
  categories:
    - id: functional-defect
      core: true
      description: "The change does not do what it intends: wrong logic, missed edge case, unchecked return, resource leak, race, wrong interface use."
      example_comment: "The readiness probe hits /health before the DB pool is initialized, so the pod reports ready and then 500s; probe /ready instead."
      axes: [functional-defect]
    - id: design-structure
      core: true
      description: "Organization and solution approach: where code lives, duplication, complexity, module boundaries, whether the change belongs here at all."
      example_comment: "Three environments now copy the same 200 lines of module wiring; make it one module with a variables map."
      axes: [design-structure]
    - id: naming
      core: true
      description: "Identifiers, file names, and messages that do not communicate what the thing is or does, or violate the language's casing convention."
      example_comment: "Resource name `aws_s3_bucket.bucket2` says nothing; name it for what it stores, and do not repeat the type."
      axes: [naming]
    - id: documentation
      core: true
      description: "Missing or misleading comments, doc comments, README or changelog updates for a change that alters behavior or interface."
      example_comment: "Every variable needs a type and a description; `region` has neither."
      axes: [documentation]
    - id: style
      core: true
      description: "Formatting and visual layout that a formatter or linter would normalize."
      example_comment: "Run terraform fmt; the alignment is off in the locals block."
      axes: [style]
    - id: testing
      core: true
      description: "Missing, incorrect, or unconvincing tests; test structure; flakiness; test data."
      example_comment: "Add a plan-diff test for this module; nothing proves the new variable is wired through."
      axes: [testing]
    - id: error-handling
      core: true
      description: "How failures are represented, propagated, logged, retried, and surfaced; crashes or aborts on reachable paths."
      example_comment: "This retries forever on a 4xx; only retry on 5xx and add a cap."
      axes: [error-handling, reliability-rollout]
    - id: performance
      core: true
      description: "Unnecessary work, allocation, blocking, or resource use with observable cost."
      example_comment: "Each layer reinstalls apt packages because the COPY comes first; move the COPY after the RUN to keep the cache."
      axes: [performance, container-image]
    - id: security
      core: true
      description: "Vulnerabilities and unsafe trust assumptions not covered by a more specific category."
      example_comment: "The service account is bound to cluster-admin; scope a Role to the namespace it needs."
      axes: [security, workload-least-privilege]
    - id: dependency-supply-chain
      core: true
      description: "Adding, upgrading, pinning, licensing, or auditing third-party dependencies and CI actions."
      example_comment: "Pin actions/checkout to a full commit SHA, not @v4; a tag can be moved."
      axes: [dependency-supply-chain, ci-workflow-security]
    - id: process
      core: true
      description: "PR hygiene: description, scope, evidence required by the template, changelog, commit structure."
      example_comment: "This changes a production security group; the PR needs a rollback plan in the description."
      axes: [process]
    - id: question
      core: true
      description: "A request for understanding rather than a finding; the reviewer is asking what or why."
      example_comment: "Why does this job need contents: write? I only see it reading the repo."
      axes: [design-structure]
    - id: other
      core: true
      description: "Does not fit any category; must be rare, and frequent use indicates the lens is wrong."
      example_comment: "Unrelated, but the README diagram still shows the old cluster layout."
      axes: [process]
    - id: container-image
      description: "Dockerfile hygiene: base image pinning, multi-stage builds, non-root USER, layer ordering, .dockerignore, no secrets in layers."
      example_comment: "Use a digest-pinned base image and drop to a non-root USER in the final stage."
      axes: [container-image]
    - id: k8s-manifest
      description: "Kubernetes resources: API versions, resource requests and limits, probes, labels, no naked pods, image tags not :latest."
      example_comment: "Set resource requests and limits on this container, and use a versioned image tag instead of :latest."
      axes: [k8s-manifest, workload-least-privilege]
    - id: iac-terraform
      description: "Terraform and other IaC: module structure, version pinning, variable types and descriptions, state and secrets handling, fmt and validate."
      example_comment: "Pin the module to a major.minor and set required_version; unpinned modules will drift between applies."
      axes: [iac-terraform]
    - id: ci-workflow-security
      description: "CI workflow safety: pinned actions, least-privilege GITHUB_TOKEN, no script injection from untrusted input, OIDC over long-lived secrets."
      example_comment: "`${{ github.event.issue.title }}` is interpolated straight into run:; assign it to an env var first to avoid script injection."
      axes: [ci-workflow-security]
    - id: supply-chain-provenance
      description: "Build provenance, signed releases, SBOMs, reproducibility, and SLSA build-level requirements."
      example_comment: "Publish provenance for this release artifact; without it we are at SLSA Build L0 for the image."
      axes: [supply-chain-provenance]
    - id: workload-least-privilege
      description: "RBAC, service accounts, network policy, pod security, IAM roles: does the workload get more than it needs?"
      example_comment: "This IAM policy grants s3:* on all buckets; restrict to the one bucket and the two actions the job uses."
      axes: [workload-least-privilege]
    - id: secrets-config
      description: "How secrets and environment configuration reach the workload: no plaintext in repo or logs, masking, secret managers."
      example_comment: "The API token is in terraform.tfvars in the repo; move it to the secrets manager and read it via a data source."
      axes: [secrets-config]
    - id: observability
      description: "Metrics, logs, traces and alerts covering latency, traffic, errors and saturation for the changed component."
      example_comment: "The new endpoint has no latency histogram or error counter; add both before we route traffic to it."
      axes: [observability]
    - id: reliability-rollout
      description: "Rollout and rollback safety: readiness and liveness probes, health checks, canaries, migrations, backward compatibility, timeouts and retries."
      example_comment: "This migration drops a column the old pods still read; deploy the code that stops reading it first."
      axes: [reliability-rollout]
    - id: api-contract
      description: "HTTP or RPC contracts other teams consume: OpenAPI accuracy, backward compatibility, semantic versioning of breaking changes."
      example_comment: "Renaming this response field is a breaking change; bump the major version or add the new field alongside."
      axes: [api-contract]

